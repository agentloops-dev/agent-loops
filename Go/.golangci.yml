# scripts/lint.sh runs golangci-lint for bugs and security (#1224), and gocognit for
# readability (#6182): a function too hard to read is too hard to review. A finding not in
# Go/.golangci-baseline.txt fails the run (#5645).
version: "2"
linters:
  default: none
  enable: [govet, staticcheck, errcheck, ineffassign, unused, gosec, forbidigo, gocognit]
  settings:
    # gocognit: a function's cognitive complexity (how hard it is to read, not its big-O)
    # is at most 30, gocognit's default (#6182). Split a function that is over it into
    # smaller ones whose names say what they do. The findings main had when it came are in
    # the baseline, and the tasks under #6182 take them out, one Go package each.
    gocognit:
      min-complexity: 30
    # No agentsd test waits for a fixed time (#6128, epic #6126): a fixed wait ends before a
    # loaded -race runner answers (spike #5600, cause B). Wait on a channel or an event, or
    # for afterLimit(t), the limit from t.Deadline() (#5632). A short poll step inside such a
    # wait gets //nolint:forbidigo with why.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Sleep$
          msg: "an agentsd test waits on a channel or an event, or for afterLimit(t), not for a fixed time (#6128)"
        - pattern: ^time\.After$
          msg: "an agentsd test waits for afterLimit(t), the limit from t.Deadline(), not for a fixed time (#6128)"
  exclusions:
    presets: [std-error-handling, common-false-positives]
    rules:
      # forbidigo's rule is for agentsd's tests only.
      - path-except: ^internal/agentsd/.*_test\.go$
        linters: [forbidigo]
