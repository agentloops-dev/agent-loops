# The runtimes' toolsets (#4512). Each pins its adapter exactly in package.json, with npm's
# lock beside it, and manifest.json names the same version. Dependabot does not bump the
# adapters (#7590): its PR changes package.json and the lock but not the manifest, so it fails
# TestTheBundlesNodeToolsetsPinOneVersion (#7588), and it skips the turn test. The Runtime
# check (.agents/workflows/nightly-runtimes.md, Tuesday and Friday) re-pins each adapter with
# scripts/update-toolset.sh and opens a PR for a version that passes a real turn. Dependabot
# still watches the packages below the adapter in the lock.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /App/Resources/toolsets/claude
      - /App/Resources/toolsets/codex
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@agentclientprotocol/claude-agent-acp"
      - dependency-name: "@agentclientprotocol/codex-acp"
    versioning-strategy: increase
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - integration
    commit-message:
      prefix: "toolsets:"

  # The workspace (#5628): Nx at the root and the web app in Web/, one pnpm lockfile
  # (pnpm-lock.yaml) and the pnpm pin (package.json's packageManager). Dependabot's npm
  # ecosystem reads pnpm's lockfile. A release waits 7 days first, as pnpm-workspace.yaml's
  # minimumReleaseAge does (rule 1 of epic #5627). A pnpm bump also changes the SHA-512 in
  # packageManager, which scripts/pnpm.sh checks: its PR fails until that hash is the new one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "workspace:"
