name: slow-tests

on:
  workflow_dispatch:
    inputs:
      coverage:
        description: Run only the Swift coverage jobs, as the nightly run does (#3442).
        type: boolean
        default: false
      nx:
        description: Run only the Nx run with no cache, as the nightly run does (#5629).
        type: boolean
        default: false
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  slow-tests:
    if: github.event_name == 'workflow_dispatch' && !inputs.coverage && !inputs.nx
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      AGENTS_RUN_SLOW: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Run slow AgentsKit tests
        run: |
          filter=$(scripts/slow-tests.sh Packages/AgentsKit)
          swift test --package-path Packages/AgentsKit --filter "$filter"
      - name: Run quarantined flaky tests
        continue-on-error: true
        env:
          AGENTS_RUN_FLAKY: "1"
        run: |
          status=0
          for package in Packages/CodeText Packages/AgentsKit; do
            filter=$(scripts/flaky-tests.sh "$package")
            [ -n "$filter" ] || continue
            swift test --package-path "$package" --filter "$filter" || status=1
          done
          exit $status

  # The wall-clock budgets (#225): held only here and by scripts/perf-tests.sh on a quiet
  # Mac, the Go ones with no -race (#5911). Everywhere else these tests check what they
  # compute and print the time.
  perf-tests:
    if: github.event_name == 'workflow_dispatch' && !inputs.coverage && !inputs.nx
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      # Go for the Go tests that hold a budget (#5911), as go.mod names it.
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod

      - name: Run the performance budgets
        run: scripts/perf-tests.sh

  # Swift coverage took longer than the PR job's test budget. Run it at night so it
  # cannot hold a pull request or a main push; this workflow is not a required check.
  # Each package has its own budget: AgentsKit's whole job takes about 6 minutes, and
  # CodeText's ran to the 60-minute limit on every night from 2026-10-28 to 11-03, on
  # an xcode-27 runner that the day's pull requests wait for (#594). 20 minutes is
  # more than three times AgentsKit's job; a CodeText run that needs more is hung.
  #
  # CodeText's tests pass in a second; what hung was the JSON export that `swift test`
  # makes after them (#3442). It read the coverage map of the 20 vendored tree-sitter
  # grammars, megabytes of generated C each, and on the runner's 7 GB filled 36 GB of
  # swap. That C is not ours to cover, so CodeText builds its C with no coverage map:
  # its Swift is still measured, and the whole test step takes seconds.
  coverage-swift:
    if: github.event_name == 'schedule' || (inputs.coverage && !inputs.nx)
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AgentsKit
            minutes: 60
            test-minutes: 55
            build-flags: ""
          - package: CodeText
            minutes: 20
            test-minutes: 15
            build-flags: -Xcc -fno-coverage-mapping
    runs-on: xcode-27
    timeout-minutes: ${{ matrix.minutes }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          xcodebuild -version
          if [[ "${{ matrix.package }}" == AgentsKit ]]; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # The build and the test run are two steps, so a log says which one stops (#3442).
      - name: Build with coverage
        timeout-minutes: ${{ matrix.test-minutes }}
        run: |
          swift build --build-tests --enable-code-coverage ${{ matrix.build-flags }} \
            --package-path Packages/${{ matrix.package }}

      - name: Test with coverage
        # Leaves 5 minutes of the job for the coverage report and its upload.
        timeout-minutes: ${{ matrix.test-minutes }}
        run: |
          if [[ "${{ matrix.package }}" == AgentsKit ]]; then
            swift test --skip-build --enable-code-coverage --package-path Packages/AgentsKit \
              --experimental-maximum-parallelization-width 3
          else
            swift test --skip-build --enable-code-coverage --package-path Packages/CodeText
          fi

      - name: Report Swift coverage
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          package_path="Packages/${{ matrix.package }}"
          profile=""
          binary=""
          if [[ -d "$package_path/.build" ]]; then
            profile=$(find "$package_path/.build" -path '*/codecov/default.profdata' -type f -print -quit)
            # -ipath: this toolchain builds into .build/out/Products/Debug, not .build/<triple>/debug.
            binary=$(find "$package_path/.build" -ipath "*/debug/${{ matrix.package }}*Tests.xctest/Contents/MacOS/*Tests" -type f -print -quit)
          fi
          if [[ -f "$profile" && -n "$binary" ]]; then
            echo '### ${{ matrix.package }} coverage' >> "$GITHUB_STEP_SUMMARY"
            xcrun llvm-cov report -instr-profile="$profile" "$binary" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Coverage profile not available; the test may have timed out.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Swift coverage profiles
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: swift-coverage-${{ matrix.package }}
          path: Packages/${{ matrix.package }}/.build/**/codecov/*
          if-no-files-found: ignore
          # The profiles are under .build, which upload-artifact skips as hidden otherwise.
          include-hidden-files: true
          retention-days: 14

  # Every Nx task on main with no cache (#5629, rule 6 of epic #5627): the one check for an input
  # that nobody declared. Nx hashes only the inputs that project.json names, so a task that reads
  # something else gets a cached pass when that thing changes (the spike's false pass, #5613).
  # Here the task runs, and when it fails at a hash where main's cache has a pass, an input is
  # missing: this files a bug that names the task. The tasks and the runners are the ci.yml go
  # and test jobs'. It saves no cache.
  nx-no-cache:
    if: github.event_name == 'schedule' || inputs.nx
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI's go job leaves the Xcode projects out on Linux; test and apps run them on macOS.
          - os: linux
            runs-on: ubuntu-latest
            exclude: --exclude=tag:xcode
          - os: macos
            runs-on: macos-latest
            exclude: --exclude=web
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    env:
      # Rule 2 of #5627: never Nx Cloud; no .env file, which no hash reads.
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
    steps:
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      # The Xcode that .xcode-version names, which every Swift task's hash reads (rule 4 of
      # #5627), as ci.yml's macOS jobs set it. Without it the runner's default Xcode compiled
      # at hashes that say another one, and its type checker gave up on SidebarSmartRow.swift,
      # where 27.2 passes (#5892, #5893, #5894).
      - name: Xcode
        if: matrix.os == 'macos'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      # What ci.yml's `apps` and `test-swift` set up: mac:build and remote:build need
      # xcodegen, and the app and AgentsKit compile Metal.
      - name: Tools
        if: matrix.os == 'macos'
        run: |
          xcodebuild -version
          brew install xcodegen &
          xcodegen_pid=$!
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache: false
      # main's newest Nx cache, as ci.yml saves it: the passes to compare with.
      - name: Restore main's Nx cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-${{ matrix.os }}-${{ github.sha }}
          restore-keys: nx-${{ matrix.os }}-
      - name: Install from the lockfile
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      # The pinned linters on the PATH, as ci.yml's go job puts them there (#5890): on Linux
      # scripts/lint.sh runs only a linter on the PATH, so without this step every lint target
      # fails here and is filed as an input that nobody declared. On macOS lint.sh gets them.
      - name: Lint tools
        if: matrix.os == 'linux'
        timeout-minutes: 5
        run: |
          scripts/lint.sh --tools "$RUNNER_TEMP/lint-tools" shellcheck golangci-lint govulncheck biome jscpd
          echo "$RUNNER_TEMP/lint-tools" >> "$GITHUB_PATH"
      # Before the run, which may write its own results over them.
      - name: The cached passes
        run: node scripts/nx-undeclared.mjs passes > "$RUNNER_TEMP/passes.txt"
      - name: Every task, with no cache
        id: run
        timeout-minutes: 30
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == macos ]]; then
            export TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)
          fi
          scripts/nx.sh run-many -t gen,build,vet,lint,test ${{ matrix.exclude }} --skip-nx-cache \
            --parallel=1 --output-style=stream
      - name: File a bug for each input that nobody declared
        if: ${{ failure() && steps.run.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OS: ${{ matrix.os }}
        shell: bash
        run: |
          node scripts/nx-undeclared.mjs compare "$RUNNER_TEMP/passes.txt" > "$RUNNER_TEMP/undeclared.txt"
          while read -r -u 3 task hash; do
            title="Nx: $task fails with no cache at a hash that has a cached pass (an input is not declared)"
            echo "::error::$task failed at $hash, where main's cache has a pass: an input is not declared."
            if [[ -n "$(gh issue list --state open --label bug --search "in:title \"Nx: $task fails\"" --json number -q '.[].number')" ]]; then
              echo "An open bug already names $task."
              continue
            fi
            cat > "$RUNNER_TEMP/body.md" <<BODY
          The nightly run on \`main\` with no Nx cache (#5629) ran \`$task\` on $OS, and it failed. Its hash, \`$hash\`, has a pass in main's cache, so an earlier run with the same inputs passed: the task reads something that its \`project.json\` does not name as an input.

          Find what the task reads (a file, a tool's version, an environment variable) and add it to the task's \`inputs\`, so its hash changes when that thing does (rules 3, 4 and 6 of epic #5627). Then run \`scripts/nx.sh run $task --skip-nx-cache\`.

          Run: $RUN_URL
          BODY
            gh issue create --title "$title" --label bug --label size:S --label feature:build \
              --body-file "$RUNNER_TEMP/body.md"
          done 3< "$RUNNER_TEMP/undeclared.txt"
