# Builds both apps and runs the package tests, on every push to main and every pull
# request. The same steps work on a Mac by hand; see the run notes in the report.
#
# Tests that need something a runner has not got are gated by their own switches and
# stay off here: AGENTS_LIVE (+ AGENTS_MCP_HELPER) for real runtimes, AGENTS_BARE for
# the bare ssh container. Tests that only fail under load are marked `.flakyUnderLoad`
# (Packages/*/Tests/**/FlakyUnderLoad.swift lists each and why); GitHub sets CI, so the
# main runs skip them; they run separately through slow-tests.yml. Wall-clock budgets
# are `.perfBudget` (PerfBudget.swift): checked everywhere, but the budget is held only by
# scripts/perf-tests.sh, slow-tests.yml's perf-tests job (#225).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run, but never a run on main (#2218). When each
# merge cancelled the one before it, a busy main finished no run for six hours and the
# release could not tag. GitHub keeps one running and at most one pending run per group,
# and a newer push replaces the pending one, so a burst of merges costs one extra run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which macOS jobs this run needs (#594), on a runner that is never short. Most of a
  # pull request's time to land was spent queued for a macOS runner, not building: in
  # October 2026 `test` waited 3–31 minutes and `packages` 8–36 to run for a few seconds
  # with nothing selected. A job skipped by its `if:` still satisfies a required check,
  # so the macOS jobs start only when there is work for them. The jobs' own
  # selection steps still choose the suites; this only decides whether they start, and
  # if it fails they start anyway.
  #
  # A push to main no longer waits here first (#595, removed by #2218): a run on main is
  # not cancelled now, so the wait only made every main run five minutes slower.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apps: ${{ steps.test-selection.outputs.apps }}
      agentskit: ${{ steps.test-selection.outputs.agentskit }}
      codetext: ${{ steps.test-selection.outputs.codetext }}
      go: ${{ steps.test-selection.outputs.go }}
      marks: ${{ steps.marks.outputs.marks }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select test suites for changed files
        id: test-selection
        # `shell: bash` adds `-o pipefail`: without it the pipe into `tee` hid a failing
        # selection (#1320).
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" && -n "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          fi
          bash scripts/select-test-suites.sh "$base" | tee -a "$GITHUB_OUTPUT"

      # The `marks` job (#4615) starts only when a mark, its source or this file changed; with
      # no base to compare against it starts anyway.
      - name: Did a mark change
        id: marks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          marks=run
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(design/logo/blob/final/|scripts/design\.sh$|App/Resources/Assets\.xcassets/|Remote/Resources/Assets\.xcassets/AppIcon|Web/assets/|docs/assets/|docs/favicon\.ico$|www/assets/|\.github/workflows/ci\.yml$)' || marks=skip
          fi
          echo "marks=$marks" | tee -a "$GITHUB_OUTPUT"

  # The test job ran the Xcode builds and the package builds and tests one after the
  # other, and they share nothing: a run that touched both took 20–24 minutes on its own
  # (October 2026: AgentsKit 5–6, the two macOS schemes 4–5, the Remote 3–4, agentsd and
  # the tests 2–4). `apps` and `swift` now run side by side, each with its own caches, and
  # `test` below, the check main requires, is red unless both of them passed.
  apps:
    needs: select
    # `always()` so a failed `select` still runs this job rather than skipping it, which
    # would read as a pass.
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.apps != 'skip') }}
    # The project targets the macOS and iOS 27 SDKs, which only this image has.
    # A preview image while macOS 27 is new; move to macos-27 when it is GA.
    runs-on: xcode-27
    # Room for both schemes and the Remote from cold. The "Time left for" steps below read
    # the same number as JOB_MINUTES; change them together.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      # For the step budgets below (scripts/ci-time-left.sh, #5609).
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      # The cache keys read the tree, not the history, and nothing here selects suites.
      - uses: actions/checkout@v6
      # A build graph is only good for the toolchain that wrote it. SwiftPM bakes
      # absolute SDK and framework paths into the objects it produces, and the runner's
      # Xcode moves under it: an image update left every restored cache pointing at an
      # SDK that was no longer there, the objects were considered up to date, and the
      # link failed with every AgentsKitCore symbol undefined. This is part of every
      # cache key below, so a new image is a miss — a cold build that works — rather
      # than a restore nobody can use. Both facts come from the image and are true
      # before anything is restored, which is why this runs here and not in Tools.
      - name: Toolchain fingerprint
        id: toolchain
        run: |
          version="$(xcodebuild -version | tr -dc '0-9A-Za-z.')"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          echo "fingerprint=${version}-sdk${sdk}" >> "$GITHUB_OUTPUT"

      # The Xcode and SwiftPM keys end in a hash of the sources their builds read (#269).
      # They used to hash only project.yml and the package manifests, so a change to the
      # sources still found an exact key: the old build was restored, the save after it
      # was skipped as a hit, and every run built on that one stale graph until someone
      # deleted the cache by hand. Now new sources miss their exact key, start warm from
      # the nearest restore-key, and save a key of their own. `git ls-tree` names each
      # folder by its tree hash, so this costs nothing and changes exactly when a file
      # under one of them does. (AgentsKit's key already hashes its sources.)
      - name: Cache keys
        id: keys
        env:
          MANIFESTS: ${{ hashFiles('project.yml', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}
        run: |
          xcode="$(git ls-tree HEAD -- project.yml App Host Packages Remote RemoteNotify RemoteWidget Shared Web | git hash-object --stdin)"
          swiftpm="$(git ls-tree HEAD -- Packages/AgentsKit Packages/CodeText | git hash-object --stdin)"
          echo "base=${{ steps.toolchain.outputs.fingerprint }}-${MANIFESTS}" >> "$GITHUB_OUTPUT"
          echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"
          echo "swiftpm=${swiftpm}" >> "$GITHUB_OUTPUT"
          agentskit="$(git ls-tree HEAD -- Packages/AgentsKit/Package.swift Packages/AgentsKit/Sources | git hash-object --stdin)"
          echo "agentskit=${agentskit}" >> "$GITHUB_OUTPUT"

      # Restore Xcode and SwiftPM products from separate caches. The Xcode cache
      # can be saved as soon as both app builds finish.
      #
      # Each falls back from its own key, to the newest built from the same manifests,
      # to the newest of its kind for this toolchain. Partial builds are never restored:
      # a cancelled run can leave a large, unusable cache. There is deliberately no key
      # that ignores the fingerprint: that let a graph from the old image be restored
      # under a new one.
      - name: Restore Xcode build cache
        id: xcode-cache
        uses: actions/cache/restore@v5
        with:
          path: build/DD
          key: macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}
          restore-keys: |
            macos-xcode-27-derived-${{ steps.keys.outputs.base }}-
            macos-xcode-27-derived-${{ steps.toolchain.outputs.fingerprint }}-

      # A graph restored from another tree can hold an AgentsKit that Xcode will not
      # rebuild: on 2026-10-11 three pull requests (#679, #681, #683) restored main's older
      # DerivedData, the Swift driver compiled none of AgentsKitCore's changed sources,
      # the Mac window failed against the old module, and the clean retry below cost 6–9
      # minutes each. The save records which AgentsKit sources the graph was built from;
      # when they differ, only AgentsKit's own objects go, and the rest stays warm.
      - name: Drop a stale AgentsKit from the Xcode build cache
        if: steps.xcode-cache.outputs.cache-matched-key != '' && steps.xcode-cache.outputs.cache-hit != 'true'
        env:
          AGENTSKIT: ${{ steps.keys.outputs.agentskit }}
        run: |
          built="$(cat build/DD/agentskit-sources 2>/dev/null || true)"
          if [[ "$built" != "$AGENTSKIT" ]]; then
            echo "AgentsKit sources differ from the restored graph's (${built:-unrecorded}); dropping its objects."
            rm -rf build/DD/Build/Intermediates.noindex/AgentsKit.build
            find build/DD/Build/Products -maxdepth 2 -name 'AgentsKit*' -exec rm -rf {} +
          fi

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen &
          xcodegen_pid=$!
          # The runner's Xcode comes without it, and the app's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"

      # Agents Host's build makes Web/dist, which is not checked in (#473), with the pinned
      # Node; without it the app would build with no web remote.
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          # Not its pnpm cache: scripts/pnpm.sh installs pnpm (#5628).
          package-manager-cache: false

      # Agents Host carries agentsd, agents-control and the MCP servers, all Go (#1314): its
      # build fails without Go.
      #
      # The build cache is our own below, not setup-go's, as in `go` (#2512). setup-go keys
      # it on go.mod alone, and `go-darwin` and `skew` share that key on macOS, so it held
      # whatever the first run after a go.mod change compiled, and none of it was this
      # job's darwin/arm64 and darwin/amd64 `-trimpath` builds: the seven helpers took
      # 1.8–3.3 minutes of every run (November 2026), on the longest pole of a pull
      # request's run.
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache: false
      # Keyed on the Go sources, as in `go`: a pull request starts from its own newest, else
      # main's. Go's build cache is content-addressed, so a restore from an older tree is
      # only less warm, never wrong. go.mod names the toolchain.
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
          restore-keys: |
            go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-apps-${{ runner.os }}-

      - name: Generate the project
        run: xcodegen generate

      # The Linux agentsd folder is a build output and gitignored, and the app copies
      # it. Empty is what a Mac without scripts/build-linux-agentsd.sh has.
      - name: Make room for the Linux agentsd
        run: mkdir -p App/Resources/servers

      # One scheme after the other, and with plug-in validation skipped: without it
      # SwiftTerm's plug-in fails and says nothing. No signing on a runner. Agents, the one
      # Mac app (#4224), carries agentsd and agents-control (Go).
      - name: Time left for the Mac build
        id: budget-mac
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          RESERVE: 4
        run: bash scripts/ci-time-left.sh
      - name: Build Agents (macOS)
        id: build-mac
        timeout-minutes: ${{ fromJSON(steps.budget-mac.outputs.minutes) }}
        env:
          RESTORED: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          build() {
            xcodebuild build -project Agents.xcodeproj -scheme AgentsHost \
              -destination 'platform=macOS' -derivedDataPath build/DD \
              -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
          }
          clean_retry "$RESTORED" build/DD -- build

      # The Go helpers are built in Agents Host's build above, so its outcome alone says
      # whether the Go cache is complete; the Remote's build does not touch it. Each ref
      # keeps only its newest, as the Xcode caches do.
      - name: Save Go build cache
        if: ${{ always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true' && steps.build-mac.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
      - name: Prune old Go build caches for this ref
        if: ${{ always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true' && steps.build-mac.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-apps-${{ runner.os }}-" "go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" "$GITHUB_REF"

      # arm64 only. A generic simulator destination builds every simulator arch, so the
      # Remote, its widget and AgentsKitCore were compiled a second time for x86_64, a
      # slice nothing runs on these Apple Silicon runners and nothing ships: in October
      # 2026 that was about half of this step's 3–6.5 minutes, the longest pole of a
      # pull request's run. The sources compiled are the same either way.
      - name: Time left for the Remote build
        id: budget-remote
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          RESERVE: 2
        run: bash scripts/ci-time-left.sh
      - name: Build Remote (iOS Simulator)
        id: build-remote
        timeout-minutes: ${{ fromJSON(steps.budget-remote.outputs.minutes) }}
        env:
          RESTORED: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" build/DD -- \
            xcodebuild build -project Agents.xcodeproj -scheme Remote \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DD \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO ARCHS=arm64

      # Only when both app builds actually ran. They are skipped whenever an earlier
      # step fails, and a skipped step used to read as "not successful", so a job that
      # died long before them saved whatever DerivedData it happened to be holding.
      #
      # Only on a push to main, as the golangci-lint cache (2026-11-13). This graph is
      # 1.9 GB, and each pull request saved one of its own under its merge ref, which no
      # other pull request can read: five open ones were 9.5 GB of the 10 GB the repo
      # may keep, and GitHub evicted the small caches to make room. The SwiftPM cache was
      # missing in most runs, and `go-apps` and AgentsKit in some, which made those runs
      # the slowest (20 minutes and more). A pull request still restores main's newest
      # graph through the restore-keys above, so it starts as warm as before; a second
      # push to the same pull request starts from main's graph, not its own.
      - name: Record the AgentsKit sources this graph was built from
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.xcode-cache.outputs.cache-hit != 'true' && steps.build-mac.outcome == 'success' && steps.build-remote.outcome == 'success' }}
        run: echo "${{ steps.keys.outputs.agentskit }}" > build/DD/agentskit-sources

      - name: Save Xcode build cache
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.xcode-cache.outputs.cache-hit != 'true' && steps.build-mac.outcome == 'success' && steps.build-remote.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: build/DD
          key: macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}

      - name: Prune old Xcode caches for this ref
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-mac.outcome == 'success' && steps.build-remote.outcome == 'success' && steps.xcode-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-derived- 'macos-xcode-27-derived-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}' "$GITHUB_REF"

  # AgentsKit and CodeText: built and tested with SwiftPM, beside `apps`.
  swift:
    needs: select
    # Starts only when the selector chose a suite for it, and whenever the selection failed.
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.agentskit != 'skip' || needs.select.outputs.codetext != 'skip') }}
    runs-on: xcode-27
    # Long enough for the package builds, CodeText and the whole AgentsKit suite. It was
    # ten minutes, and a run the selector chose as `full` takes longer than that on this
    # runner: the job was cancelled at the cap with every test before it passing, on
    # main as well as on a branch (run 36642820605). The selection is what keeps this
    # small; the cap has to fit the run it lets through. The "Time left for" steps below
    # read the same number as JOB_MINUTES; change them together.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      # For the step budgets below (scripts/ci-time-left.sh, #5609).
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          # The selector compares against the PR base or the previous push.
          fetch-depth: 0

      - name: Select test suites for changed files
        id: test-selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" && -n "$DEFAULT_BRANCH" ]]; then
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)
          fi
          bash scripts/select-test-suites.sh "$base" >> "$GITHUB_OUTPUT"

      # A build graph is only good for the toolchain that wrote it. SwiftPM bakes
      # absolute SDK and framework paths into the objects it produces, and the runner's
      # Xcode moves under it: an image update left every restored cache pointing at an
      # SDK that was no longer there, the objects were considered up to date, and the
      # link failed with every AgentsKitCore symbol undefined. This is part of every
      # cache key below, so a new image is a miss — a cold build that works — rather
      # than a restore nobody can use. Both facts come from the image and are true
      # before anything is restored, which is why this runs here and not in Tools.
      - name: Toolchain fingerprint
        id: toolchain
        run: |
          version="$(xcodebuild -version | tr -dc '0-9A-Za-z.')"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          echo "fingerprint=${version}-sdk${sdk}" >> "$GITHUB_OUTPUT"

      # The Xcode and SwiftPM keys end in a hash of the sources their builds read (#269).
      # They used to hash only project.yml and the package manifests, so a change to the
      # sources still found an exact key: the old build was restored, the save after it
      # was skipped as a hit, and every run built on that one stale graph until someone
      # deleted the cache by hand. Now new sources miss their exact key, start warm from
      # the nearest restore-key, and save a key of their own. `git ls-tree` names each
      # folder by its tree hash, so this costs nothing and changes exactly when a file
      # under one of them does. (AgentsKit's key already hashes its sources.)
      - name: Cache keys
        id: keys
        env:
          MANIFESTS: ${{ hashFiles('project.yml', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}
        run: |
          xcode="$(git ls-tree HEAD -- project.yml App Host Packages Remote RemoteNotify RemoteWidget Shared Web | git hash-object --stdin)"
          swiftpm="$(git ls-tree HEAD -- Packages/AgentsKit Packages/CodeText | git hash-object --stdin)"
          echo "base=${{ steps.toolchain.outputs.fingerprint }}-${MANIFESTS}" >> "$GITHUB_OUTPUT"
          echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"
          echo "swiftpm=${swiftpm}" >> "$GITHUB_OUTPUT"
          agentskit="$(git ls-tree HEAD -- Packages/AgentsKit/Package.swift Packages/AgentsKit/Sources | git hash-object --stdin)"
          echo "agentskit=${agentskit}" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/CodeText/.build
          key: macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}
          restore-keys: |
            macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-
            macos-xcode-27-swiftpm-${{ steps.toolchain.outputs.fingerprint }}-

      - name: Restore AgentsKit build cache
        id: agentskit-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}
          restore-keys: |
            macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}-
            macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-

      # The same stale graph as the Xcode cache's above (#684), in SwiftPM's build: on
      # 2026-10-13 every pull request that changed AgentsKit (#882, #886, #887, #889)
      # restored an older .build, SwiftPM recompiled AgentsKit but not AgentsKitCore, the
      # link failed on undefined AgentsKitCore symbols, and the clean retry rebuilt the
      # dependencies too: 6–11 minutes for a step that takes under one when warm. The save
      # records which AgentsKit sources the graph was built from; when they differ, only the
      # package's own targets go, and swift-nio, swift-nio-ssl and SwiftTerm stay warm.
      - name: Drop a stale AgentsKit from the AgentsKit build cache
        if: steps.agentskit-cache.outputs.cache-matched-key != '' && steps.agentskit-cache.outputs.cache-hit != 'true'
        env:
          AGENTSKIT: ${{ steps.keys.outputs.agentskit }}
        run: bash scripts/drop-stale-agentskit.sh Packages/AgentsKit/.build "$AGENTSKIT"

      - name: Tools
        run: |
          xcodebuild -version
          # The runner's Xcode comes without it, and AgentsKit's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain

      # SwiftPM's build graph records the random cryptex mount name for MetalToolchain,
      # and every absolute path of the Xcode and SDK that produced it. Rewrite the mount
      # when the component version matches; drop the graph when it names an Xcode or SDK
      # this runner does not have, which is what an image update looks like from here.
      - name: Normalize AgentsKit build cache
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: python3 scripts/normalize-metaltoolchain-cache.py Packages/AgentsKit/.build
      # Every build below that starts from a restored cache gets one more go from clean
      # when it fails (scripts/ci-clean-retry.sh says why). The step only fails, and so
      # is only kept from the cache, when the clean build fails as well.
      - name: Time left for the AgentsKit build
        id: budget-build-agentskit
        if: steps.test-selection.outputs.agentskit != 'skip'
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          RESERVE: 4
        run: bash scripts/ci-time-left.sh
      - name: Build AgentsKit tests
        id: build-agentskit
        if: steps.test-selection.outputs.agentskit != 'skip'
        timeout-minutes: ${{ fromJSON(steps.budget-build-agentskit.outputs.minutes) }}
        env:
          RESTORED: ${{ steps.agentskit-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Packages/AgentsKit/.build -- \
            swift build --build-tests --package-path Packages/AgentsKit

      - name: Record the AgentsKit sources this build was made from
        if: ${{ always() && steps.agentskit-cache.outputs.cache-hit != 'true' && steps.build-agentskit.outcome == 'success' }}
        run: echo "${{ steps.keys.outputs.agentskit }}" > Packages/AgentsKit/.build/agentskit-sources

      # Only completed builds are saved. Cancellation must not persist a partial cache
      # that can fill runner disk or poison a later restore.
      - name: Save AgentsKit build cache
        if: ${{ always() && steps.agentskit-cache.outputs.cache-hit != 'true' && steps.build-agentskit.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}

      - name: Prune old AgentsKit caches for this ref
        if: ${{ always() && steps.build-agentskit.outcome == 'success' && steps.agentskit-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-agentskit- 'macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/AgentsKit/Sources/**/*', 'Packages/AgentsKit/Tests/**/*', 'Packages/AgentsKit/Plugins/**/*') }}' "$GITHUB_REF"

      # How long the runner's login shell takes to say its PATH. The app reads it
      # once per process, synchronously, the first time anything looks a runtime up.
      - name: Time the login shell
        if: steps.test-selection.outputs.agentskit != 'skip'
        run: time zsh -lc 'printf %s "$PATH"' > /dev/null

      # Build CodeText tests before execution so the cache can be saved before tests.
      - name: Time left for the CodeText build
        id: budget-build-codetext
        if: steps.test-selection.outputs.codetext != 'skip'
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      - name: Build CodeText tests
        id: build-codetext
        if: steps.test-selection.outputs.codetext != 'skip'
        timeout-minutes: ${{ fromJSON(steps.budget-build-codetext.outputs.minutes) }}
        env:
          RESTORED: ${{ steps.swiftpm-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          clean_retry "$RESTORED" Packages/CodeText/.build -- \
            swift build --build-tests --package-path Packages/CodeText

      - name: Save SwiftPM build cache
        # Never on a failure, for the reason above.
        if: ${{ always() && steps.swiftpm-cache.outputs.cache-hit != 'true' && steps.build-codetext.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: Packages/CodeText/.build
          key: macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}

      - name: Prune old SwiftPM caches for this ref
        if: ${{ always() && steps.build-codetext.outcome == 'success' && steps.swiftpm-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-swiftpm- 'macos-xcode-27-swiftpm-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.swiftpm }}' "$GITHUB_REF"

      - name: Time left for the CodeText tests
        id: budget-test-codetext
        if: steps.test-selection.outputs.codetext != 'skip'
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      - name: Test CodeText
        if: steps.test-selection.outputs.codetext != 'skip'
        timeout-minutes: ${{ fromJSON(steps.budget-test-codetext.outputs.minutes) }}
        env:
          TEST_FILTER: ${{ steps.test-selection.outputs.codetext_filter }}
          TEST_MODE: ${{ steps.test-selection.outputs.codetext }}
        run: |
          if [ "$TEST_MODE" = filter ]; then
            swift test --skip-build --package-path Packages/CodeText --filter "$TEST_FILTER"
          else
            swift test --skip-build --package-path Packages/CodeText
          fi

      # A job that reaches its timeout-minutes ends Cancelled, not Failed: no checks.failed,
      # no red mark, and a pull request with auto-merge on waits for a required check that
      # will never come. A step's own timeout fails the step, so each long step gets what
      # the job has left, less a reserve for the steps after it, and a slow run ends red
      # before the job's cap can cancel it (scripts/ci-time-left.sh, #5609).
      - name: Time left for the AgentsKit tests
        id: budget
        if: steps.test-selection.outputs.agentskit != 'skip'
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          RESERVE: 2
          MAX: 25
        run: bash scripts/ci-time-left.sh

      - name: Test AgentsKit
        if: steps.test-selection.outputs.agentskit != 'skip'
        # A filtered run is a few seconds and a full one is two to fourteen minutes, so
        # this is the full run's budget rather than the filtered one's: at most 25, and
        # never past the job's own cap (the step above).
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        # `shell: bash` adds `-o pipefail`. Without it the `if` below read `tee`'s status,
        # always 0, so a failing suite passed (#1320). PIPESTATUS[0] is still swift's.
        shell: bash
        env:
          TEST_FILTER: ${{ steps.test-selection.outputs.agentskit_filter }}
          TEST_MODE: ${{ steps.test-selection.outputs.agentskit }}
          RESTORED: ${{ steps.agentskit-cache.outputs.cache-matched-key }}
        run: |
          # At most three tests at a time, one per core (#1320). Unbounded, the full suite
          # had thousands in flight on this three-core runner: their `eventually` loops
          # took the CPU, trivial tests waited 60 s, and 189 to 331 failed in 14 to 23
          # minutes. Capped at 3 locally it takes the same two minutes on a tenth of the CPU.
          # A full run takes the four test targets one at a time (#5630), so the log says
          # which target failed and how long each took; a failing one does not stop the
          # rest.
          run_agentskit_tests() {
            if [ "$TEST_MODE" = filter ]; then
              swift test --skip-build --package-path Packages/AgentsKit \
                --experimental-maximum-parallelization-width 3 --filter "$TEST_FILTER"
              return
            fi
            local failed=0 target start
            for target in AgentsKitTests AgentsKitRepoTests AgentsKitControlTests AgentsKitIntegrationTests; do
              start=$SECONDS
              echo "::group::$target"
              swift test --skip-build --package-path Packages/AgentsKit \
                --experimental-maximum-parallelization-width 3 --filter "^${target}\\." || failed=1
              echo "::endgroup::"
              echo "$target took $((SECONDS - start)) s"
            done
            return "$failed"
          }

          log="$RUNNER_TEMP/agentskit-tests.log"
          if run_agentskit_tests 2>&1 | tee "$log"; then
            exit 0
          else
            status=${PIPESTATUS[0]}
          fi
          if [ -z "$RESTORED" ]; then exit "$status"; fi

          if grep -Eq 'Undefined symbols for architecture|symbol\(s\) not found for architecture|AgentsKitCore.*undefined' "$log"; then
            echo "::warning::Stale AgentsKit link detected on a restored cache. Rebuilding and rerunning immediately from clean."
          else
            echo "::warning::AgentsKit tests failed on a restored build cache. Rebuilding and rerunning once from clean."
          fi
          rm -rf Packages/AgentsKit/.build
          swift build --build-tests --package-path Packages/AgentsKit
          run_agentskit_tests

  # The check main requires. It used to be the whole macOS job; now it reads the two that
  # replaced it. A job that failed or was cancelled (at its cap) makes this red; a job
  # skipped for want of work passes, as a skipped `test` did. `always()` without
  # `!cancelled()`: a skipped required check reads as a pass, so a cancelled run must end
  # here red rather than skip it.
  test:
    needs: [select, apps, swift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both macOS jobs passed or had nothing to do
        env:
          APPS: ${{ needs.apps.result }}
          SWIFT: ${{ needs.swift.result }}
        run: |
          echo "apps: $APPS, swift: $SWIFT"
          for result in "$APPS" "$SWIFT"; do
            [[ $result == success || $result == skipped ]] || exit 1
          done


  # Nx over the Go module, the web app, the Wire code generation and the design tokens
  # (#5628, epic #5627): go:build, go:vet, go:test (-race), web:build, web:lint (tsc, the lint
  # that keeps agent output inert, the licence list), web:test (which holds the build to its
  # MANIFEST), wire:gen and design:gen, on Linux. Each project's project.json names the
  # inputs of its tasks; a lane runs the same with scripts/nx.sh.
  go:
    runs-on: ubuntu-latest
    # The "Time left for" step below reads the same number as JOB_MINUTES; change both.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    env:
      # Rule 2 of #5627: never Nx Cloud; no .env file, which no hash reads.
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
    steps:
      # For the step budgets below (scripts/ci-time-left.sh, #5609).
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      # actions/cache refuses a path with '..', so the Nx cache is in the runner's temp folder.
      # Its index is a database in the workspace data, so both are saved, or a restore gets no
      # hits (rule 5 of #5627).
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      # The pull request's own commit, not its merge with main: the hashes are then the lane's
      # (#5584). The base for `nx affected` is its merge base with main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      # The build cache is our own below, not setup-go's (#2512): keyed on go.mod alone, it held
      # whatever the first run after a go.mod change compiled.
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache: false
      # Go's own caches, under Nx's: a go:test that Nx runs again still skips the packages
      # whose inputs did not change. Content-addressed, so an older restore is only less warm.
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-race-${{ runner.os }}-
      # A pull request starts from its own newest cache, else main's (it can read main's, not
      # another pull request's).
      - name: Restore the Nx cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-linux-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: nx-linux-
      # The pinned pnpm (package.json's packageManager, its hash checked) and only what the
      # lockfile says, with no install script (rule 1 of #5627).
      - name: Install from the lockfile
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      - name: Time left for Nx
        id: budget
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 25
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      # What the change affects, each task skipped when the cache has a pass at its hash: on a
      # pull request since its merge base with main, on main since the push before; with no
      # base (a new branch, a run by hand), every task.
      - name: Nx affected
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          targets=gen,build,vet,lint,test
          # One task at a time: go:test -race beside web:test made both fail under load (#5632),
          # as they did not when each had a job of its own.
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/nx.sh affected -t "$targets" --base="$BASE" --head=HEAD --parallel=1 --output-style=static
          else
            scripts/nx.sh run-many -t "$targets" --parallel=1 --output-style=static
          fi
      # wire:gen and design:gen ran before the tasks that read their files, so a change that
      # did not commit what they write would pass the tests: it fails here.
      - name: Generated files are committed
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::A generated file is not what its source makes: run scripts/wire.sh gen and scripts/design.sh gen, and commit what they write."
            exit 1
          fi
      # A failed task is not cached, so a failed run's cache is still good; a cancelled one may
      # not have finished writing. Each ref keeps only its newest.
      - name: Save the Nx cache
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-linux-" "nx-linux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      - name: Save Go build cache
        if: ${{ always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
      - name: Prune old Go build caches for this ref
        if: ${{ always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-race-${{ runner.os }}-" "go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" "$GITHUB_REF"

  # Mixed versions (#1767): the last release's agentsd joined to this tree's control plane,
  # and the last release's control plane with this tree's client, as a person meets them
  # while an update rolls out (docs/explanation/versions.md). It needs the tags.
  skew:
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.go != 'skip') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache-dependency-path: Go/go.mod
      - name: Last release against this tree
        run: scripts/skew-test.sh

  # The same on a Mac (#1138), so a Mac-only path (its root, its folders, a *_darwin.go file)
  # is held as Linux's is: the Go module and what it reads. TMPDIR is resolved, because a Mac's
  # temporary folder is reached through the /var link and the daemon keeps folders with their
  # links resolved, as the Swift one does.
  go-darwin:
    runs-on: macos-latest
    # The "Time left for" step below reads the same number as JOB_MINUTES; change both.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      # Rule 2 of #5627: never Nx Cloud; no .env file, which no hash reads.
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
    steps:
      # For the step budgets below (scripts/ci-time-left.sh, #5609).
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      # actions/cache refuses a path with '..', so the Nx cache is in the runner's temp folder.
      # Its index is a database in the workspace data, so both are saved, or a restore gets no
      # hits (rule 5 of #5627).
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      # The pull request's own commit, not its merge with main: the hashes are then the lane's
      # (#5584). The base for `nx affected` is its merge base with main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      # The build cache is our own below, not setup-go's (#2512): keyed on go.mod alone, it held
      # whatever the first run after a go.mod change compiled.
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache: false
      # Go's own caches, under Nx's: a go:test that Nx runs again still skips the packages
      # whose inputs did not change. Content-addressed, so an older restore is only less warm.
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-race-${{ runner.os }}-
      # A pull request starts from its own newest cache, else main's (it can read main's, not
      # another pull request's).
      - name: Restore the Nx cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-macos-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: nx-macos-
      # The pinned pnpm (package.json's packageManager, its hash checked) and only what the
      # lockfile says, with no install script (rule 1 of #5627).
      - name: Install from the lockfile
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      - name: Time left for Nx
        id: budget
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      # What the change affects, each task skipped when the cache has a pass at its hash: on a
      # pull request since its merge base with main, on main since the push before; with no
      # base (a new branch, a run by hand), every task.
      - name: Nx affected
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          export TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)
          targets=gen,build,vet,lint,test
          # One task at a time: go:test -race beside web:test made both fail under load (#5632),
          # as they did not when each had a job of its own.
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/nx.sh affected -t "$targets" --exclude=web --base="$BASE" --head=HEAD --parallel=1 --output-style=static
          else
            scripts/nx.sh run-many -t "$targets" --exclude=web --parallel=1 --output-style=static
