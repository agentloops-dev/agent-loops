# Builds both apps and runs the package tests, on every push to main and every pull
# request. The same steps work on a Mac by hand; see the run notes in the report.
#
# Tests that need something a runner has not got are gated by their own switches and
# stay off here: AGENTS_LIVE (+ AGENTS_MCP_HELPER) for real runtimes, AGENTS_BARE for
# the bare ssh container. Tests that only fail under load are marked `.flakyUnderLoad`
# (Packages/*/Tests/**/FlakyUnderLoad.swift lists each and why); GitHub sets CI, so the
# main runs skip them; they run separately through slow-tests.yml. Wall-clock budgets
# are `.perfBudget` (PerfBudget.swift): checked everywhere, but the budget is held only by
# scripts/perf-tests.sh, slow-tests.yml's perf-tests job (#225).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # By hand, or by scripts/bisect-main.sh (#5587): `sha` runs at that commit of main, not the
  # branch's head, and `jobs` runs only those jobs (space-separated: go, apps, test; empty: all).
  # A run with a sha saves no cache, so a bisect step at an old commit never becomes main's
  # newest cache.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to check out (empty: the branch's head)"
        required: false
        default: ""
      jobs:
        description: "Jobs to run, space-separated: go apps test (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

# A newer push cancels a pull request's run, but never a run on main (#2218). When each
# merge cancelled the one before it, a busy main finished no run for six hours and the
# release could not tag. GitHub keeps one running and at most one pending run per group,
# and a newer push replaces the pending one, so a burst of merges costs one extra run.
# A run with a sha (a bisect step, #5587) has a group of its own, so it never replaces main's
# pending run.
concurrency:
  group: ci-${{ github.ref }}${{ inputs.sha && format('-{0}', inputs.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The one Linux job (#5645), on every change. First it says which macOS work this change
  # needs, from Nx's project graph (#5631): its outputs start `apps` and `test` only when a
  # project of theirs is affected, so a change to docs/ or a skill boots no macOS runner. A job
  # skipped by its `if:` satisfies a required check; a workflow-level `paths:` filter would
  # leave it pending instead. Then Nx over the Go module, the web app, the Wire code generation
  # and the design tokens (#5628, epic #5627): go:build, go:vet, go:test (-race), web:build,
  # web:lint (tsc, the lint that keeps agent output inert, the licence list, Biome), web:test
  # (which holds the build to its MANIFEST), wire:gen, design:gen, go:lint (golangci-lint,
  # govulncheck) and repo-lint:lint (shellcheck, zsh -n, our text checks, jscpd; #5672), each
  # linter failing on a finding. Then the Wire compat check and the mixed-versions test (#1767).
  # Each project's project.json names the inputs of its tasks; a lane runs the same with
  # scripts/nx.sh. The Xcode projects (tag xcode) are `apps` and `test`'s.
  #
  # The macOS jobs wait for this one (its outputs are there only when it ends): about two
  # minutes for a change with no Go, more with Go (Alex, 2026-11-15, #5645).
  go:
    if: ${{ !inputs.jobs || contains(format(' {0} ', inputs.jobs), ' go ') }}
    runs-on: ubuntu-latest
    # The limit of every job (Alex, 2026-11-15, #5673): 20 minutes, and red when it runs out.
    # The "Time left for" steps below read the same number as JOB_MINUTES; change them together.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      # The attestation/<platform> check runs on the pull request's commits, and the heads it
      # had before a force push (#5585).
      checks: read
      pull-requests: read
    env:
      # Rule 2 of #5627: never Nx Cloud; no .env file, which no hash reads.
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      swift: ${{ steps.affected.outputs.swift }}
      go: ${{ steps.affected.outputs.go }}
      marks: ${{ steps.affected.outputs.marks }}
      swiftlint: ${{ steps.affected.outputs.swiftlint }}
      toolchain: ${{ steps.affected.outputs.toolchain }}
      gomac: ${{ steps.affected.outputs.gomac }}
      skip-swift: ${{ steps.affected.outputs.skip-swift }}
      skip-gomac: ${{ steps.affected.outputs.skip-gomac }}
    steps:
      # For the step budgets below (scripts/ci-time-left.sh, #5609).
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      # actions/cache refuses a path with '..', so the Nx cache is in the runner's temp folder.
      # Its index is a database in the workspace data, so both are saved, or a restore gets no
      # hits (rule 5 of #5627).
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      # The pull request's own commit, not its merge with main: the hashes are then the lane's
      # (#5584). The base for `nx affected` is its merge base with main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      # The commits this run checks, from the last green run on main (#5587).
      - name: Batch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-batch.sh
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      # The build cache is our own below, not setup-go's (#2512): keyed on go.mod alone, it held
      # whatever the first run after a go.mod change compiled.
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache: false
      # Go's own caches, under Nx's: a go:test that Nx runs again still skips the packages
      # whose inputs did not change. Content-addressed, so an older restore is only less warm.
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-race-${{ runner.os }}-
      # A pull request starts from its own newest cache, else main's (it can read main's, not
      # another pull request's).
      - name: Restore the Nx cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-linux-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          restore-keys: nx-linux-
      # The pinned pnpm (package.json's packageManager, its hash checked) and only what the
      # lockfile says, with no install script (rule 1 of #5627).
      - name: Install from the lockfile
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      # The Nx hash of each affected task at the pull request's own commit, with no task run
      # (#5584): a lane's attestation/<platform> check run names its tasks by these. For
      # information; "Affected projects" calculates them again for its skips (#5585).
      - name: Nx task hashes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          { echo "### Nx task hashes, $(uname -sm)"; echo '```'; node scripts/nx-hashes.cjs --affected "$BASE" test vet lint; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # What each job runs, by what this change affects: on a pull request since its merge base
      # with main, on main since the push before; with no base (a new branch, a run by hand),
      # everything. Each later step, here and in the macOS jobs, reads these in its `if:`.
      #
      # Then, on a pull request only, the tasks that a lane's attestation covers (#5585, epic
      # #5581 §3; scripts/ci-attested.mjs): a statement from the agents' bot, from a lane that is
      # not revoked (#5586 adds the list), whose task and Nx hash are the ones CI calculates now
      # at the head, PASSED. skip-<step> lists them and that step runs only the others; a macOS
      # step with every task covered gets `skip` (swift, gomac, swiftlint), so `test` may not start at all.
      # A push to main and a run by hand skip nothing. With no accepted attestation, or when
      # GitHub does not answer, nothing is skipped (principle 11). The job summary lists each
      # skipped task and the check run that covers it.
      - name: Affected projects
        id: affected
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          apps=run swift=run go=run marks=run swiftlint=run toolchain=same
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            projects=$(scripts/nx.sh show projects --affected --base="$BASE" --head=HEAD --json)
            echo "Affected: $projects"
            has() { jq -e --arg p "$1" 'index($p) != null' <<<"$projects" >/dev/null; }
            has mac || has remote || apps=skip
            has agentskit || has agentskit-repo || has codetext || swift=skip
            has go || go=skip
            changed=$(git diff --name-only "$BASE" HEAD)
            # The marks (#4615): a mark, its source or this file.
            grep -qE '^(design/logo/blob/final/|scripts/design\.sh$|App/Resources/Assets\.xcassets/|Remote/Resources/Assets\.xcassets/AppIcon|Web/assets/|docs/assets/|docs/favicon\.ico$|www/assets/|\.github/workflows/ci\.yml$)' <<<"$changed" || marks=skip
            # SwiftLint (swift-lint:lint, in `test`): any Swift file, its rules, its baseline or
            # lint.sh. swift-lint is affected by every change, so its own files say when.
            grep -qE '(\.swift$|^\.swiftlint(\.yml|-baseline\.json)$|^scripts/lint\.sh$|^lint/swift/)' <<<"$changed" || swiftlint=skip
            # A new Go toolchain (#5704): Go's build cache is keyed by the toolchain, so every
            # Go package builds again from cold, and the macOS jobs get more time for it.
            gover() { git show "$1:Go/go.mod" 2>/dev/null | grep -E '^(go|toolchain) ' || true; }
            [[ "$(gover "$BASE")" == "$(gover HEAD)" ]] || toolchain=new
          fi
          # gomac is `test`'s Go on a Mac: go, but skip when an attestation covers all of it.
          gomac=$go
          if [[ -n "$PR" ]] && [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            attested=$(node scripts/ci-attested.mjs select --base "$BASE" --pr "$PR") || attested=
            echo "$attested"
            grep '^skip-' <<<"$attested" >> "$GITHUB_OUTPUT" || true
            grep -qx 'all-swift=true' <<<"$attested" && swift=skip
            grep -qx 'all-gomac=true' <<<"$attested" && gomac=skip
            grep -qx 'all-swiftlint=true' <<<"$attested" && swiftlint=skip
          fi
          printf 'apps=%s\nswift=%s\ngo=%s\ngomac=%s\nmarks=%s\nswiftlint=%s\ntoolchain=%s\n' "$apps" "$swift" "$go" "$gomac" "$marks" "$swiftlint" "$toolchain" | tee -a "$GITHUB_OUTPUT"
      # The pinned linters (scripts/lint.sh --tools), on the PATH for the lint targets in Nx
      # (#5672): go:lint (golangci-lint, govulncheck), web:lint (Biome) and repo-lint:lint
      # (shellcheck, zsh -n, our text checks, jscpd). Each fails on a finding. The binaries are
      # cached, and golangci-lint's analysis with them.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/lint-tools
          key: lint-tools-${{ hashFiles('scripts/lint.sh') }}
      # golangci-lint's analysis, warm from main's newest; only a push to main that changed Go
      # saves one.
      - uses: actions/cache/restore@v5
        id: golangci-cache
        if: steps.affected.outputs.go != 'skip'
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('Go/**/*.go', 'Go/go.sum', 'Go/.golangci.yml') }}
          restore-keys: golangci-lint-
      - name: Lint tools
        run: |
          scripts/lint.sh --tools ~/.cache/lint-tools shellcheck golangci-lint govulncheck biome jscpd
          echo "$HOME/.cache/lint-tools" >> "$GITHUB_PATH"
      # The reserve is the steps after it: the mixed-versions test (about a minute), the Wire
      # compat check and the cache saves. The linters are Nx's lint targets, inside this budget.
      - name: Time left for Nx
        id: budget
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          RESERVE: 6
        run: bash scripts/ci-time-left.sh
      # What the change affects, each task skipped when the cache has a pass at its hash: on a
      # pull request since its merge base with main, on main since the push before; with no
      # base (a new branch, a run by hand), every task. On a pull request, not the tasks that an
      # attestation covers (SKIP, from "Affected projects"; #5585).
      - name: Nx affected
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # A lint target says which of its findings are in this change's files.
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SKIP: ${{ steps.affected.outputs.skip-linux }}
        run: |
          git cat-file -e "$LINT_BASE^{commit}" 2>/dev/null || LINT_BASE=
          targets=gen,build,vet,lint,test
          # One task at a time: go:test -race beside web:test made both fail under load (#5632),
          # as they did not when each had a job of its own.
          if [[ -n "$SKIP" ]]; then
            node scripts/ci-attested.mjs run --group linux --base "$BASE" --skip "$SKIP"
          elif [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/nx.sh affected -t "$targets" --exclude='tag:xcode' --base="$BASE" --head=HEAD --parallel=1 --output-style=static
          else
            scripts/nx.sh run-many -t "$targets" --exclude='tag:xcode' --parallel=1 --output-style=static
          fi
      # wire:gen and design:gen ran before the tasks that read their files, so a change that
      # did not commit what they write would pass the tests: it fails here.
      - name: Generated files are committed
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::A generated file is not what its source makes: run scripts/wire.sh gen and scripts/design.sh gen, and commit what they write."
            exit 1
          fi
      - if: ${{ (always() && github.event_name == 'push' && steps.affected.outputs.go != 'skip' && steps.golangci-cache.outputs.cache-hit != 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('Go/**/*.go', 'Go/go.sum', 'Go/.golangci.yml') }}
      # What a caller sends changed since the last release tag with the same capability
      # number (#4095): an older server refuses it, and the caller cannot know.
      - name: Wire compat
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --quiet "$BASE" HEAD -- Packages/Wire; then
            echo "Packages/Wire did not change."
          else
            scripts/wire.sh compat
          fi
      # Mixed versions (#1767): the last release's agentsd joined to this tree's control plane,
      # and the last release's control plane with this tree's client, as a person meets them
      # while an update rolls out (docs/explanation/versions.md). It needs the tags, which the
      # checkout above fetched.
      - name: Time left for the mixed-versions test
        id: skew-budget
        if: ${{ always() && !cancelled() && steps.affected.outputs.go != 'skip' }}
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          RESERVE: 1
          MAX: 10
        run: bash scripts/ci-time-left.sh
      - name: Last release against this tree
        if: ${{ always() && !cancelled() && steps.affected.outputs.go != 'skip' }}
        timeout-minutes: ${{ fromJSON(steps.skew-budget.outputs.minutes) }}
        run: scripts/skew-test.sh
      # A failed task is not cached, so a failed run's cache is still good; a cancelled one may
      # not have finished writing. Each ref keeps only its newest.
      - name: Save the Nx cache
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-linux-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-linux-" "nx-linux-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      - name: Save Go build cache
        if: ${{ (always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
      - name: Prune old Go build caches for this ref
        if: ${{ (always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true') && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-race-${{ runner.os }}-" "go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" "$GITHUB_REF"
      # Where this job's minutes went, in its summary; on a failure near the limit, an error that
      # names the slowest step (#5673).
      - name: Step times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          STATUS: ${{ job.status }}
        run: bash scripts/ci-step-times.sh

  # The Mac app and the Remote, as Nx's mac:build and remote:build (#5631): each an xcodebuild
  # through scripts/build-cache.sh, as a lane runs it, and the Blob's marks (#4615). A check main
  # requires. They share nothing with the package tests, so `apps` and `test` run side by side.
  # Nx skips a build whose inputs (App/project.json, Remote/project.json) have a pass in the Nx
  # cache; Xcode's DerivedData stays below it, in a cache of its own. Each step's `if:` reads
  # `go`'s outputs (APPS, MARKS), so a change to the marks alone builds no app.
  apps:
    needs: go
    # `always()` so a failed `go` still runs this job rather than skipping it, which would read
    # as a pass: an output that `go` did not reach is empty, not 'skip', so its steps run.
    # A run by hand that leaves `go` out (#5587) leaves its outputs empty, so every step runs.
    if: ${{ always() && !cancelled() && (!inputs.jobs || contains(format(' {0} ', inputs.jobs), ' apps ')) && (needs.go.outputs.apps != 'skip' || needs.go.outputs.marks != 'skip') }}
    # The project targets the macOS and iOS 27 SDKs, which only this image has.
    # A preview image while macOS 27 is new; move to macos-27 when it is GA.
    runs-on: xcode-27
    # The limit of every job, as in `go` (#5673). Both schemes from a cold DerivedData do not fit
    # in it: such a run fails, and its Step times say so. A change of the Go toolchain gets 40
    # (#5704): every Go helper then builds from cold inside mac:build, which takes about 11.5
    # minutes warm. The steps read the same number from JOB_MINUTES; change them together.
    timeout-minutes: ${{ needs.go.outputs.toolchain == 'new' && 40 || 20 }}
    permissions:
      contents: read
      actions: write
    env:
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
      JOB_MINUTES: ${{ needs.go.outputs.toolchain == 'new' && 40 || 20 }}
      APPS: ${{ needs.go.outputs.apps }}
      MARKS: ${{ needs.go.outputs.marks }}
    steps:
      # For the step budgets below (scripts/ci-time-left.sh, #5609).
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      # actions/cache refuses a path with '..', so the Nx cache is in the runner's temp folder,
      # with its database (rule 5 of #5627).
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      # The pull request's own commit, as in `go` (#5584).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      # The Xcode that .xcode-version names, which every Swift task's hash reads (rule 4 of
      # #5627).
      - name: Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      # The Blob's marks (#4615): every icon, favicon and touch icon is what `scripts/design.sh
      # marks` makes from the one source in design/logo/blob/final/. It renders with AppKit, so it
      # runs on the macOS 27 image that a Mac renders the same as.
      - name: Every mark is what the Blob source makes
        if: env.MARKS != 'skip'
        run: scripts/design.sh marks --check
      # A build graph is only good for the toolchain that wrote it. SwiftPM bakes absolute SDK
      # and framework paths into the objects it produces, and the runner's Xcode moves under
      # it: an image update left every restored cache pointing at an SDK that was no longer
      # there, and the link failed with every AgentsKitCore symbol undefined. This is part of
      # every cache key below, so a new image is a miss (a cold build that works) rather than a
      # restore nobody can use.
      - name: Toolchain fingerprint
        if: env.APPS != 'skip'
        id: toolchain
        run: |
          version="$(xcodebuild -version | tr -dc '0-9A-Za-z.')"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          echo "fingerprint=${version}-sdk${sdk}" >> "$GITHUB_OUTPUT"
      # The DerivedData key ends in a hash of the sources its builds read (#269), so new sources
      # miss their exact key, start warm from the nearest restore-key, and save a key of their
      # own. `git ls-tree` names each folder by its tree hash.
      - name: Cache keys
        if: env.APPS != 'skip'
        id: keys
        env:
          MANIFESTS: ${{ hashFiles('project.yml', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}
        run: |
          xcode="$(git ls-tree HEAD -- project.yml App Host Packages Remote RemoteNotify RemoteShare RemoteWidget Shared Web | git hash-object --stdin)"
          echo "base=${{ steps.toolchain.outputs.fingerprint }}-${MANIFESTS}" >> "$GITHUB_OUTPUT"
          echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"
          agentskit="$(git ls-tree HEAD -- Packages/AgentsKit/Package.swift Packages/AgentsKit/Sources | git hash-object --stdin)"
          echo "agentskit=${agentskit}" >> "$GITHUB_OUTPUT"
      # DerivedData (build-cache.sh's build/DerivedData) and the packages it fetches. Each falls
      # back to the newest built from the same manifests, then to the newest for this toolchain;
      # there is deliberately no key that ignores the fingerprint.
      - name: Restore Xcode build cache
        if: env.APPS != 'skip'
        id: xcode-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/DerivedData
            ~/Library/Caches/Agents-build/packages
            ~/Library/Caches/Agents-build/checkouts
          key: macos-xcode-27-dd-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}
          restore-keys: |
            macos-xcode-27-dd-${{ steps.keys.outputs.base }}-
            macos-xcode-27-dd-${{ steps.toolchain.outputs.fingerprint }}-
      # A graph restored from another tree can hold an AgentsKit that Xcode will not rebuild
      # (#679, #681, #683): when the recorded AgentsKit sources differ, only AgentsKit's own
      # objects go, and the rest stays warm.
      - name: Drop a stale AgentsKit from the Xcode build cache
        if: ${{ env.APPS != 'skip' && (steps.xcode-cache.outputs.cache-matched-key != '' && steps.xcode-cache.outputs.cache-hit != 'true') }}
        env:
          AGENTSKIT: ${{ steps.keys.outputs.agentskit }}
        run: |
          built="$(cat build/DerivedData/agentskit-sources 2>/dev/null || true)"
          if [[ "$built" != "$AGENTSKIT" ]]; then
            echo "AgentsKit sources differ from the restored graph's (${built:-unrecorded}); dropping its objects."
            rm -rf build/DerivedData/Build/Intermediates.noindex/AgentsKit.build
            find build/DerivedData/Build/Products -maxdepth 2 -name 'AgentsKit*' -exec rm -rf {} +
          fi
      - name: Tools
        if: env.APPS != 'skip'
        run: |
          xcodebuild -version
          brew install xcodegen &
          xcodegen_pid=$!
          # The runner's Xcode comes without it, and the app's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"
      # Agents Host's build makes Web/dist (#473) and carries agentsd, agents-control and the MCP
      # servers, all Go (#1314).
      - uses: actions/setup-node@v5
        if: env.APPS != 'skip'
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      # Not setup-go's cache (#2512): keyed on go.mod alone, it held none of this job's
      # darwin/arm64 and darwin/amd64 `-trimpath` builds.
      - uses: actions/setup-go@v6
        if: env.APPS != 'skip'
        with:
          go-version-file: Go/go.mod
          cache: false
      - name: Restore Go build cache
        if: env.APPS != 'skip'
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
          restore-keys: |
            go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-apps-${{ runner.os }}-
      - name: Restore the Nx cache
        if: env.APPS != 'skip'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-apps-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          restore-keys: nx-apps-
      - name: Install from the lockfile
        if: env.APPS != 'skip'
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      - name: Time left for Nx
        if: env.APPS != 'skip'
        id: budget
        env:
          START: ${{ steps.clock.outputs.start }}
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      # mac:build and remote:build, one at a time (they share build/DerivedData), and the tasks
      # they depend on (wire:gen, design:gen, web:build). A build that fails on a restored
      # DerivedData gets one more go from clean (scripts/ci-clean-retry.sh says why); a task that
      # passed is in the Nx cache, so the retry runs only what failed.
      - name: Nx affected
        if: env.APPS != 'skip'
        id: nx
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RESTORED: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          nx_apps() {
            if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              scripts/nx.sh affected -t build --exclude='*,!mac,!remote' --base="$BASE" --head=HEAD --parallel=1 --output-style=static
            else
              scripts/nx.sh run-many -t build --projects=mac,remote --parallel=1 --output-style=static
            fi
          }
          clean_retry "$RESTORED" build/DerivedData -- nx_apps
      - name: Save the Nx cache
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled())) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-apps-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled())) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-apps-" "nx-apps-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      # The Go helpers are built in Agents Host's build, so its outcome alone says whether the Go
      # cache is complete. Each ref keeps only its newest.
      - name: Save Go build cache
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true' && steps.nx.outcome == 'success')) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
      - name: Prune old Go build caches for this ref
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true' && steps.nx.outcome == 'success')) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-apps-${{ runner.os }}-" "go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" "$GITHUB_REF"
      # Only on a push to main, as the golangci-lint cache (2026-11-13): this graph is about 2 GB,
      # and a pull request's own, under its merge ref, no other pull request can read. A pull
      # request restores main's newest through the restore-keys above. Only when both schemes
      # built in this run: an Nx cache hit builds nothing, and leaves DerivedData as it was.
      - name: Did both schemes build here
        id: built
        if: ${{ env.APPS != 'skip' && (always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.xcode-cache.outputs.cache-hit != 'true' && steps.nx.outcome == 'success') }}
        run: |
          if [[ -d build/DerivedData/Build/Products/Debug && -d build/DerivedData/Build/Products/Debug-iphonesimulator ]]; then
            echo "${{ steps.keys.outputs.agentskit }}" > build/DerivedData/agentskit-sources
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save Xcode build cache
        if: ${{ (env.APPS != 'skip' && (always() && steps.built.outputs.save == 'true')) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/DerivedData
            ~/Library/Caches/Agents-build/packages
            ~/Library/Caches/Agents-build/checkouts
          key: macos-xcode-27-dd-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}
      - name: Prune old Xcode caches for this ref
        if: ${{ (env.APPS != 'skip' && (always() && steps.built.outputs.save == 'true')) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-dd- 'macos-xcode-27-dd-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}' "$GITHUB_REF"
      # Where this job's minutes went, in its summary; on a failure near the limit, an error that
      # names the slowest step (#5673).
      - name: Step times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.clock.outputs.start }}
          STATUS: ${{ job.status }}
        run: bash scripts/ci-step-times.sh

  # The check main requires for the Swift packages and Go on a Mac (#5645), beside `apps`:
  #  - AgentsKit and CodeText, as Nx's tasks (#5631): agentskit:test-unit, test-control and
  #    test-integration, agentskit-repo:test (the suites that read files outside the package,
  #    so their inputs are the repo's), and codetext:test, each a `swift test` through
  #    scripts/build-cache.sh. A target whose inputs did not change is a cache hit;
  #  - the Go module on a Mac (#1138), so a Mac-only path (its root, its folders, a *_darwin.go
  #    file) is held as Linux's is. TMPDIR is resolved, because a Mac's temporary folder is
  #    reached through the /var link and the daemon keeps folders with their links resolved;
  #  - SwiftLint against .swiftlint-baseline.json (#5645), as Nx's swift-lint:lint (#5672): a
  #    finding not in it fails.
  # Each step's `if:` reads `go`'s outputs (SWIFT, GO, SWIFTLINT).
  test:
    needs: go
    # `always()` so a failed `go` still runs this job rather than skipping it, which would read
    # as a pass: an output that `go` did not reach is empty, not 'skip', so its steps run.
    if: ${{ always() && !cancelled() && (!inputs.jobs || contains(format(' {0} ', inputs.jobs), ' test ')) && (needs.go.outputs.swift != 'skip' || needs.go.outputs.gomac != 'skip' || needs.go.outputs.swiftlint != 'skip') }}
    runs-on: xcode-27
    # The limit of every job, as in `go` (#5673): warm, the Swift targets take about 5 minutes
    # and the Go tests on a Mac about 7. Every AgentsKit target from cold does not fit in it:
    # such a run fails, and its Step times say so. A change of the Go toolchain gets 40, as in
    # `apps` (#5704): the Go tests then build from cold (about 10 minutes on the 1.26.11 bump).
    # The steps read the same number from JOB_MINUTES; change them together.
    timeout-minutes: ${{ needs.go.outputs.toolchain == 'new' && 40 || 20 }}
    permissions:
      contents: read
      actions: write
    env:
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
      JOB_MINUTES: ${{ needs.go.outputs.toolchain == 'new' && 40 || 20 }}
      SWIFT: ${{ needs.go.outputs.swift }}
      # Go on a Mac: `go`'s go, or skip when an attestation covers all of it (#5585).
      GO: ${{ needs.go.outputs.gomac }}
      SWIFTLINT: ${{ needs.go.outputs.swiftlint }}
    steps:
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - name: Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      # As in `apps`: a new image is a miss, not a restore nobody can use.
      - name: Toolchain fingerprint
        id: toolchain
        run: |
          version="$(xcodebuild -version | tr -dc '0-9A-Za-z.')"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          echo "fingerprint=${version}-sdk${sdk}" >> "$GITHUB_OUTPUT"
      - name: Cache keys
        id: keys
        run: |
          codetext="$(git ls-tree HEAD -- Packages/CodeText | git hash-object --stdin)"
          agentskit="$(git ls-tree HEAD -- Packages/AgentsKit | git hash-object --stdin)"
          sources="$(git ls-tree HEAD -- Packages/AgentsKit/Package.swift Packages/AgentsKit/Sources | git hash-object --stdin)"
          {
            echo "codetext=${codetext}"
            echo "agentskit=${agentskit}"
            echo "agentskit-sources=${sources}"
          } >> "$GITHUB_OUTPUT"
      - name: Restore CodeText build cache
        if: env.SWIFT != 'skip'
        id: codetext-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/CodeText/.build
          key: macos-xcode-27-codetext-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.codetext }}
          restore-keys: macos-xcode-27-codetext-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Restore AgentsKit build cache
        if: env.SWIFT != 'skip'
        id: agentskit-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.agentskit }}
          restore-keys: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-
      # The stale graph of #684 in SwiftPM's build: when the recorded AgentsKit sources differ,
      # only the package's own targets go, and swift-nio, swift-nio-ssl and SwiftTerm stay warm.
      - name: Drop a stale AgentsKit from the AgentsKit build cache
        if: ${{ env.SWIFT != 'skip' && (steps.agentskit-cache.outputs.cache-matched-key != '' && steps.agentskit-cache.outputs.cache-hit != 'true') }}
        run: bash scripts/drop-stale-agentskit.sh Packages/AgentsKit/.build "${{ steps.keys.outputs.agentskit-sources }}"
      - name: Tools
        if: env.SWIFT != 'skip'
        run: |
          xcodebuild -version
          # The runner's Xcode comes without it, and AgentsKit's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain
      # SwiftPM's build graph records the random cryptex mount name for MetalToolchain, and
      # every absolute path of the Xcode and SDK that made it: rewrite the mount, or drop the
      # graph when it names an Xcode or SDK this runner does not have.
      - name: Normalize AgentsKit build cache
        if: env.SWIFT != 'skip'
        run: python3 scripts/normalize-metaltoolchain-cache.py Packages/AgentsKit/.build
      # How long the runner's login shell takes to say its PATH. The app reads it once per
      # process, synchronously, the first time anything looks a runtime up.
      - name: Time the login shell
        if: env.SWIFT != 'skip'
        run: time zsh -lc 'printf %s "$PATH"' > /dev/null
      # agentskit-repo:test depends on web:build, as WebDistManifestTests reads Web/dist; the Go
      # tests and web:build need Node, Go and the packages too; SwiftLint, a task of Nx, Node
      # and the packages.
      - uses: actions/setup-node@v5
        if: env.SWIFT != 'skip' || env.GO != 'skip' || env.SWIFTLINT != 'skip'
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      - uses: actions/setup-go@v6
        if: env.SWIFT != 'skip' || env.GO != 'skip'
        with:
          go-version-file: Go/go.mod
          cache: false
      - name: Restore the Nx cache
        if: env.SWIFT != 'skip' || env.GO != 'skip' || env.SWIFTLINT != 'skip'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-macos-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          restore-keys: nx-macos-
      - name: Install from the lockfile
        if: env.SWIFT != 'skip' || env.GO != 'skip' || env.SWIFTLINT != 'skip'
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      # As in `go`, on macOS (#5584).
      - name: Nx task hashes
        if: github.event_name == 'pull_request' && (env.SWIFT != 'skip' || env.GO != 'skip')
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          { echo "### Nx task hashes, $(uname -sm)"; echo '```'; node scripts/nx-hashes.cjs --affected "$BASE" test vet lint; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # A job that reaches its timeout-minutes ends Cancelled, not Failed, and a pull request
      # with auto-merge on waits for a check that never comes; a step's own timeout fails the
      # step (scripts/ci-time-left.sh, #5609).
      # The reserve is the steps after it: the Go tests on a Mac when Go is affected (about 7
      # minutes), SwiftLint and the cache saves.
      - name: Time left for Nx
        if: env.SWIFT != 'skip'
        id: budget
        env:
          START: ${{ steps.clock.outputs.start }}
          RESERVE: ${{ env.GO != 'skip' && 10 || 3 }}
        run: bash scripts/ci-time-left.sh
      # One target at a time: they share each package's .build, and at most three tests at a
      # time, one per core (#1320; each target's command). Nx's log says which target failed and
      # how long each took, and a failing one does not stop the rest (--nx-bail is off). A run
      # that fails on a restored .build gets one more go from clean; the targets that passed are
      # in the Nx cache, so only the failed ones run again.
      - name: Nx affected, Swift
        if: env.SWIFT != 'skip'
        id: nx
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RESTORED: ${{ steps.agentskit-cache.outputs.cache-matched-key }}${{ steps.codetext-cache.outputs.cache-matched-key }}
          SKIP: ${{ needs.go.outputs.skip-swift }}
        run: |
          source scripts/ci-clean-retry.sh
          nx_swift() {
            if [[ -n "$SKIP" ]]; then
              node scripts/ci-attested.mjs run --group swift --base "$BASE" --skip "$SKIP"
            elif [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              scripts/nx.sh affected -t test --exclude='*,!agentskit,!agentskit-repo,!codetext' --base="$BASE" --head=HEAD --parallel=1 --output-style=static
            else
              scripts/nx.sh run-many -t test --projects=agentskit,agentskit-repo,codetext --parallel=1 --output-style=static
            fi
          }
          clean_retry "$RESTORED" Packages/AgentsKit/.build Packages/CodeText/.build -- nx_swift
      # Go's own caches, under Nx's, as in `go`.
      - name: Restore Go build cache
        id: go-cache
        if: ${{ always() && !cancelled() && env.GO != 'skip' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-race-${{ runner.os }}-
      - name: Time left for Go
        id: go-budget
        if: ${{ always() && !cancelled() && env.GO != 'skip' }}
        env:
          START: ${{ steps.clock.outputs.start }}
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      # The Go tasks on a Mac, after the Swift ones (one task at a time, #5632). Its `always()`:
      # a Swift failure does not hide a Go one.
      - name: Nx affected, Go on a Mac
        id: go-nx
        if: ${{ always() && !cancelled() && env.GO != 'skip' }}
        timeout-minutes: ${{ fromJSON(steps.go-budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SKIP: ${{ needs.go.outputs.skip-gomac }}
        run: |
          export TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)
          # No lint: go:lint and repo-lint:lint are the Linux job's, which reads Go as Linux.
          targets=gen,build,vet,test
          if [[ -n "$SKIP" ]]; then
            node scripts/ci-attested.mjs run --group gomac --base "$BASE" --skip "$SKIP"
          elif [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/nx.sh affected -t "$targets" --exclude='web,tag:xcode' --base="$BASE" --head=HEAD --parallel=1 --output-style=static
          else
            scripts/nx.sh run-many -t "$targets" --exclude='web,tag:xcode' --parallel=1 --output-style=static
          fi
      - name: SwiftLint
        if: ${{ always() && !cancelled() && env.SWIFTLINT != 'skip' }}
        run: scripts/nx.sh run swift-lint:lint --output-style=static
      - name: Save the Nx cache
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-macos-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-macos-" "nx-macos-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      # Only a .build that this run built. Never on a failure: a cancelled or failed run must not
      # persist a partial cache that poisons a later restore.
      - name: Did AgentsKit build here
        id: agentskit-built
        if: ${{ always() && !cancelled() && steps.nx.outcome == 'success' && steps.agentskit-cache.outputs.cache-hit != 'true' }}
        run: |
          if [[ -d Packages/AgentsKit/.build ]]; then
            echo "${{ steps.keys.outputs.agentskit-sources }}" > Packages/AgentsKit/.build/agentskit-sources
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save AgentsKit build cache
        if: ${{ (always() && steps.agentskit-built.outputs.save == 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.agentskit }}
      - name: Prune old AgentsKit caches for this ref
        if: ${{ (always() && steps.agentskit-built.outputs.save == 'true') && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-agentskit- 'macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.agentskit }}' "$GITHUB_REF"
      - name: Did CodeText build here
        id: codetext-built
        if: ${{ always() && !cancelled() && steps.nx.outcome == 'success' && steps.codetext-cache.outputs.cache-hit != 'true' }}
        run: |
          if [[ -d Packages/CodeText/.build ]]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save CodeText build cache
        if: ${{ (always() && steps.codetext-built.outputs.save == 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: Packages/CodeText/.build
          key: macos-xcode-27-codetext-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.codetext }}
      - name: Prune old CodeText caches for this ref
        if: ${{ (always() && steps.codetext-built.outputs.save == 'true') && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-codetext- 'macos-xcode-27-codetext-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.codetext }}' "$GITHUB_REF"
      - name: Save Go build cache
        if: ${{ (always() && !cancelled() && env.GO != 'skip' && steps.go-cache.outputs.cache-hit != 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
      - name: Prune old Go build caches for this ref
        if: ${{ (always() && !cancelled() && env.GO != 'skip' && steps.go-cache.outputs.cache-hit != 'true') && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-race-${{ runner.os }}-" "go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" "$GITHUB_REF"
      # Where this job's minutes went, in its summary; on a failure near the limit, an error that
      # names the slowest step (#5673).
      - name: Step times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.clock.outputs.start }}
          STATUS: ${{ job.status }}
        run: bash scripts/ci-step-times.sh
