# Builds both apps and runs the package tests, on every push to main and every pull
# request. The same steps work on a Mac by hand; see the run notes in the report.
#
# Tests that need something a runner has not got are gated by their own switches and
# stay off here: AGENTS_LIVE (+ AGENTS_MCP_HELPER) for real runtimes, AGENTS_BARE for
# the bare ssh container. Tests that only fail under load are marked `.flakyUnderLoad`
# (Packages/*/Tests/**/FlakyUnderLoad.swift lists each and why); GitHub sets CI, so the
# main runs skip them; they run separately through slow-tests.yml. Wall-clock budgets
# are `.perfBudget` (PerfBudget.swift): checked everywhere, but the budget is held only by
# scripts/perf-tests.sh, slow-tests.yml's perf-tests job (#225).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # By hand, or by scripts/bisect-main.sh (#5587): `sha` runs at that commit of main, not the
  # branch's head, and `jobs` runs only those jobs (space-separated: go, apps, test; empty: all).
  # `test` is test-swift, test-go and their gate, `test` (#5755).
  # A run with a sha saves no cache, so a bisect step at an old commit never becomes main's
  # newest cache.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to check out (empty: the branch's head)"
        required: false
        default: ""
      jobs:
        description: "Jobs to run, space-separated: go apps test (empty: all)"
        required: false
        default: ""

permissions:
  contents: read

# A newer push cancels a pull request's run, but never a run on main (#2218). When each
# merge cancelled the one before it, a busy main finished no run for six hours and the
# release could not tag. GitHub keeps one running and at most one pending run per group,
# and a newer push replaces the pending one, so a burst of merges costs one extra run.
# A run with a sha (a bisect step, #5587) has a group of its own, so it never replaces main's
# pending run.
concurrency:
  group: ci-${{ github.ref }}${{ inputs.sha && format('-{0}', inputs.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Only a push to main saves the large caches: Go's build caches and the Swift .build and
# DerivedData folders (#5740). A pull request's cache is under its merge ref, which only that
# pull request can read, so its 1 to 2 GB each filled the 10 GB limit and GitHub evicted main's;
# a pull request restores main's instead. A pull request still saves its small Nx cache.
env:
  MAIN_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.sha }}

jobs:
  # What each job runs (#5677): a Linux job of about a minute that reads Nx's project graph
  # (#5631), and ends. `go`, `apps` and `test` need only its outputs, so the three run side by
  # side: when the macOS jobs needed `go`, they waited for all of
  # it (its outputs are there only when a job ends), about 7 minutes on a change to Go. A macOS
  # job starts only when a project of its own is affected, so a change to docs/ or a skill boots
  # no macOS runner. A job skipped by its `if:` satisfies a required check; a workflow-level
  # `paths:` filter would leave it pending instead. Not a required check: a job that needs it
  # does not run when it fails, so each of them runs with `always()`, and an output it did not
  # reach is empty, not 'skip', so every step runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Rule 2 of #5627: never Nx Cloud; no .env file, which no hash reads.
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      swift: ${{ steps.affected.outputs.swift }}
      go: ${{ steps.affected.outputs.go }}
      marks: ${{ steps.affected.outputs.marks }}
      swiftlint: ${{ steps.affected.outputs.swiftlint }}
      gomac: ${{ steps.affected.outputs.gomac }}
    steps:
      # The pull request's own commit, not its merge with main (#5584). The base for
      # `nx affected` is its merge base with main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      # The history of this commit and of main, for `nx affected`'s merge base, and no other
      # branch (#6965): fetch-depth 0 fetched every branch and tag, the screenshots branch's
      # 524 MB with them. The jobs that read tags (`git describe`) fetch them too.
      - name: History
        run: bash scripts/ci-history.sh
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      # The pinned pnpm (package.json's packageManager, its hash checked) and only what the
      # lockfile says, with no install script (rule 1 of #5627).
      - name: Install from the lockfile
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      # What each job runs, by what this change affects: on a pull request since its merge base
      # with main, on main since the push before; with no base (a new branch, a run by hand),
      # everything. Each step of `go`, `apps` and `test` reads these in its `if:`.
      - name: Affected projects
        id: affected
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          apps=run swift=run go=run marks=run swiftlint=run
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            projects=$(scripts/nx.sh show projects --affected --base="$BASE" --head=HEAD --json)
            echo "Affected: $projects"
            has() { jq -e --arg p "$1" 'index($p) != null' <<<"$projects" >/dev/null; }
            has mac || has remote || apps=skip
            has agentskit || has agentskit-repo || has codetext || swift=skip
            has go || go=skip
            changed=$(git diff --name-only "$BASE" HEAD)
            # The marks (#4615): a mark, its source or this file.
            grep -qE '^(design/logo/blob/final/|scripts/design\.sh$|App/Resources/Assets\.xcassets/|Remote/Resources/Assets\.xcassets/AppIcon|Web/assets/|docs/assets/|docs/favicon\.ico$|www/assets/|\.github/workflows/ci\.yml$)' <<<"$changed" || marks=skip
            # SwiftLint (swift-lint:lint, the `swift-lint` job): any Swift file, its rules and
            # baseline, the Xcode (its SourceKit), lint.sh, or this file. swift-lint is affected by
            # every change, so its own files say when.
            grep -qE '(\.swift$|^\.swiftlint(\.yml|-baseline\.json)$|^\.xcode-version$|^scripts/lint\.sh$|^lint/swift/|^\.github/workflows/ci\.yml$)' <<<"$changed" || swiftlint=skip
          fi
          # gomac is `test`'s Go on a Mac: the same as go.
          gomac=$go
          printf 'apps=%s\nswift=%s\ngo=%s\ngomac=%s\nmarks=%s\nswiftlint=%s\n' "$apps" "$swift" "$go" "$gomac" "$marks" "$swiftlint" | tee -a "$GITHUB_OUTPUT"

  # The Linux job (#5645), on every change, beside `apps` and `test` (#5677): Nx over the Go
  # module, the web app, the Wire code generation and the design tokens (#5628, epic #5627):
  # go:build, go:vet, go:test (-race), web:build, web:lint (tsc, the lint that keeps agent output
  # inert, the licence list, Biome), web:test (which holds the build to its MANIFEST), wire:gen,
  # design:gen, go:lint (golangci-lint, govulncheck, deadcode) and repo-lint:lint (shellcheck, zsh -n, our
  # text checks, jscpd; #5672), each linter failing on a finding. Then the Wire compat check and
  # the mixed-versions test (#1767). Each project's project.json names the inputs of its tasks; a
  # lane runs the same with scripts/nx.sh. The Xcode projects (tag xcode) are `apps` and `test`'s.
  # Each step's `if:` reads `changes`'s outputs.
  go:
    needs: changes
    # `always()` so a failed `changes` still runs this job, with every step.
    if: ${{ always() && !cancelled() && (!inputs.jobs || contains(format(' {0} ', inputs.jobs), ' go ')) }}
    runs-on: ubuntu-latest
    # The limit of every job (Alex, 2026-11-15, #5673): 20 minutes, and red when it runs out.
    # The "Time left for" steps below read the same number as JOB_MINUTES; change them together.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      # Rule 2 of #5627: never Nx Cloud; no .env file, which no hash reads.
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
      GO: ${{ needs.changes.outputs.go }}
    steps:
      # For the step budgets below (scripts/ci-time-left.sh, #5609).
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      # actions/cache refuses a path with '..', so the Nx cache is in the runner's temp folder.
      # Its index is a database in the workspace data, so both are saved, or a restore gets no
      # hits (rule 5 of #5627).
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
          # go:test keeps each shard's log and its summary here (#6008).
          echo "GO_TEST_LOG_DIR=$RUNNER_TEMP/go-test-logs" >> "$GITHUB_ENV"
      # The pull request's own commit, not its merge with main (#5584). The base for
      # `nx affected` is its merge base with main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - name: History
        run: bash scripts/ci-history.sh --tags
      # Each tracked file's time from its content (#5677), so Go's test cache below keeps the
      # pass of a package whose tests read the repo's files: a checkout's own times made about
      # 20 of the module's packages run again on every run.
      - name: Content times
        run: python3 scripts/ci-mtimes.py
      # The commits this run checks, from the last green run on main (#5587).
      - name: Batch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-batch.sh
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      # The build cache is our own below, not setup-go's (#2512): keyed on go.mod alone, it held
      # whatever the first run after a go.mod change compiled.
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache: false
      # Go's own caches, under Nx's: a go:test that Nx runs again still skips the packages
      # whose inputs did not change. Content-addressed, so an older restore is only less warm.
      # Its key ends in full (the Go tasks passed) or part (they failed or ran out of time), then
      # the run (#5704): a part restores by prefix, so a rerun and the next run start warm, and
      # it never hits the exact key that would stop a full one from being saved.
      - name: Go build cache key
        id: go-key
        run: echo "prefix=go-race-$RUNNER_OS-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-key.outputs.prefix }}-full
          restore-keys: |
            ${{ steps.go-key.outputs.prefix }}-full-
            ${{ steps.go-key.outputs.prefix }}-
            go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-race-${{ runner.os }}-
      # Only a cache that grew in this run is saved (#5740): one that restored nothing and
      # compiled nothing is empty.
      - name: Go build cache size
        if: env.MAIN_CACHE == 'true'
        run: bash scripts/ci-cache-grew.sh mark go ~/.cache/go-build ~/Library/Caches/go-build ~/go/pkg/mod
      # A pull request starts from its own newest cache, else main's (it can read main's, not
      # another pull request's).
      - name: Restore the Nx cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-linux-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          restore-keys: nx-linux-
      # The pinned pnpm (package.json's packageManager, its hash checked) and only what the
      # lockfile says, with no install script (rule 1 of #5627).
      - name: Install from the lockfile
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      # The pinned linters (scripts/lint.sh --tools), on the PATH for the lint targets in Nx
      # (#5672): go:lint (golangci-lint, govulncheck, deadcode), web:lint (Biome) and repo-lint:lint
      # (shellcheck, zsh -n, our text checks, jscpd). Each fails on a finding. The binaries are
      # cached, and golangci-lint's analysis with them.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/lint-tools
          key: lint-tools-${{ hashFiles('scripts/lint.sh') }}
      # golangci-lint's analysis, warm from main's newest; only a push to main that changed Go
      # saves one.
      - uses: actions/cache/restore@v5
        id: golangci-cache
        if: env.GO != 'skip'
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('Go/**/*.go', 'Go/go.sum', 'Go/.golangci.yml') }}
          restore-keys: golangci-lint-
      - name: Lint tools
        run: |
          scripts/lint.sh --tools ~/.cache/lint-tools shellcheck golangci-lint govulncheck deadcode biome jscpd
          echo "$HOME/.cache/lint-tools" >> "$GITHUB_PATH"
      # The reserve is the steps after it: the mixed-versions test (about a minute), the Wire
      # compat check and the cache saves. The linters are Nx's lint targets, inside this budget.
      - name: Time left for Nx
        id: budget
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          RESERVE: 6
        run: bash scripts/ci-time-left.sh
      # What the change affects, each task skipped when the cache has a pass at its hash: on a
      # pull request since its merge base with main, on main since the push before; with no
      # base (a new branch, a run by hand), every task.
      - name: Nx affected
        id: nx
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # A lint target says which of its findings are in this change's files.
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "$LINT_BASE^{commit}" 2>/dev/null || LINT_BASE=
          targets=gen,build,vet,lint,test
          # One task at a time: go:test -race beside web:test made both fail under load (#5632),
          # as they did not when each had a job of its own.
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/nx.sh affected -t "$targets" --exclude='tag:xcode' --base="$BASE" --head=HEAD --parallel=1 --output-style=stream
          else
            scripts/nx.sh run-many -t "$targets" --exclude='tag:xcode' --parallel=1 --output-style=stream
          fi
      # Nx can cut a task's output before its end (#6008): how each go:test shard ended, from
      # outside Nx, and the shard logs as an artifact.
      - name: Go test summary
        if: ${{ failure() && steps.nx.outcome == 'failure' }}
        run: bash scripts/ci-go-test-summary.sh
      # On every run, as in test-go (#7480).
      - name: Upload the Go test logs
        if: ${{ always() && steps.nx.outcome != 'skipped' }}
        uses: actions/upload-artifact@v5
        with:
          name: go-test-logs-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-logs
          if-no-files-found: ignore
          retention-days: 7
      # wire:gen and design:gen ran before the tasks that read their files, so a change that
      # did not commit what they write would pass the tests: it fails here.
      - name: Generated files are committed
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::A generated file is not what its source makes: run scripts/wire.sh gen and scripts/design.sh gen, and commit what they write."
            exit 1
          fi
      - if: ${{ (always() && github.event_name == 'push' && env.GO != 'skip' && steps.golangci-cache.outputs.cache-hit != 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('Go/**/*.go', 'Go/go.sum', 'Go/.golangci.yml') }}
      # What a caller sends changed since the last release tag with the same capability
      # number (#4095): an older server refuses it, and the caller cannot know.
      - name: Wire compat
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --quiet "$BASE" HEAD -- Packages/Wire; then
            echo "Packages/Wire did not change."
          else
            scripts/wire.sh compat
          fi
      # Mixed versions (#1767): the last release's agentsd joined to this tree's control plane,
      # and the last release's control plane with this tree's client, as a person meets them
      # while an update rolls out (docs/explanation/versions.md). It needs the tags, which the
      # History step above fetched (ci-history.sh --tags).
      - name: Time left for the mixed-versions test
        id: skew-budget
        if: ${{ always() && !cancelled() && env.GO != 'skip' }}
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          RESERVE: 1
          MAX: 10
        run: bash scripts/ci-time-left.sh
      - name: Last release against this tree
        if: ${{ always() && !cancelled() && env.GO != 'skip' }}
        timeout-minutes: ${{ fromJSON(steps.skew-budget.outputs.minutes) }}
        run: scripts/skew-test.sh
      # A failed task is not cached, so a failed run's cache is still good; a cancelled one may
      # not have finished writing. Each ref keeps only its newest.
      - name: Save the Nx cache
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-linux-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-linux-" "nx-linux-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      - name: Did the Go build cache grow
        id: go-grew
        if: ${{ always() && !cancelled() && env.MAIN_CACHE == 'true' && !startsWith(steps.go-cache.outputs.cache-matched-key, format('{0}-full-', steps.go-key.outputs.prefix)) }}
        run: bash scripts/ci-cache-grew.sh check go ~/.cache/go-build ~/Library/Caches/go-build ~/go/pkg/mod
      # Only what a run used in the last 6 hours, under a cap, and no module zips (#5837): the
      # cache grew by every run's dead entries, and the Go caches then pushed the Xcode
      # DerivedData cache out of the repo's 10 GB. After the grow check, which reads the size
      # before the trim.
      - name: Trim the Go caches
        if: ${{ (always() && !cancelled() && steps.go-grew.outputs.save == 'true') && !inputs.sha }}
        env:
          GO_CACHE_MAX_MB: 8192
        run: bash scripts/ci-go-cache-trim.sh ~/.cache/go-build ~/go/pkg/mod
      - name: Save Go build cache
        if: ${{ (always() && !cancelled() && steps.go-grew.outputs.save == 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-key.outputs.prefix }}-${{ steps.nx.outcome == 'success' && 'full' || 'part' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prune old Go build caches for this ref
        if: ${{ (always() && !cancelled() && steps.go-grew.outputs.save == 'true') && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-race-${{ runner.os }}-" "${{ steps.go-key.outputs.prefix }}-${{ steps.nx.outcome == 'success' && 'full' || 'part' }}-${{ github.run_id }}-${{ github.run_attempt }}" "$GITHUB_REF"
      # Where this job's minutes went, in its summary; on a failure near the limit, an error that
      # names the slowest step (#5673).
      - name: Step times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          STATUS: ${{ job.status }}
        run: bash scripts/ci-step-times.sh

  # The Mac app and the Remote, as Nx's mac:build and remote:build (#5631): each an xcodebuild
  # through scripts/build-cache.sh, as a lane runs it, and the Blob's marks (#4615). A check main
  # requires. They share nothing with the package tests, so `apps` and `test` run side by side.
  # Nx skips a build whose inputs (App/project.json, Remote/project.json) have a pass in the Nx
  # cache; Xcode's DerivedData stays below it, in a cache of its own. Each step's `if:` reads
  # `changes`'s outputs (APPS, MARKS), so a change to the marks alone builds no app.
  apps:
    needs: changes
    # `always()` so a failed `changes` still runs this job rather than skipping it, which would
    # read as a pass: an output that `changes` did not reach is empty, not 'skip', so its steps run.
    if: ${{ always() && !cancelled() && (!inputs.jobs || contains(format(' {0} ', inputs.jobs), ' apps ')) && (needs.changes.outputs.apps != 'skip' || needs.changes.outputs.marks != 'skip') }}
    # The project targets the macOS and iOS 27 SDKs, which only this image has.
    # A preview image while macOS 27 is new; move to macos-27 when it is GA.
    runs-on: xcode-27
    # 30 minutes, not the 20 of every other job (#5673; Alex, 2026-11-16, #5836): warm, the job
    # takes about 15, but a new Xcode or image misses every Xcode cache, and both schemes from
    # cold take about 23 (remote:build 9.4, mac:build 13 or more), so at 20 PR #5838 timed out,
    # as the first push to main after it would. The "Time left for" step below reads the same
    # number as JOB_MINUTES; change them together.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
      APPS: ${{ needs.changes.outputs.apps }}
      MARKS: ${{ needs.changes.outputs.marks }}
    steps:
      # For the step budgets below (scripts/ci-time-left.sh, #5609).
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      # actions/cache refuses a path with '..', so the Nx cache is in the runner's temp folder,
      # with its database (rule 5 of #5627).
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      # The pull request's own commit, as in `go` (#5584).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - name: History
        run: bash scripts/ci-history.sh --tags
      # Each tracked file's time from its content, as in `go` (#5677), here for Xcode's incremental
      # build. The restored DerivedData saved almost nothing: a checkout's own times made every
      # source newer than its object, and Xcode's compilation cache is not in the CI cache (there
      # is no room for it in the 10 GB), so each run compiled everything again. Xcode compares a
      # file's time for equality, not for newer, so a changed file has another time and builds.
      - name: Content times
        if: env.APPS != 'skip'
        run: python3 scripts/ci-mtimes.py
      # The Xcode that .xcode-version names, which every Swift task's hash reads (rule 4 of
      # #5627).
      - name: Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      # The Blob's marks (#4615): every icon, favicon and touch icon is what `scripts/design.sh
      # marks` makes from the one source in design/logo/blob/final/. It renders with AppKit, so it
      # runs on the macOS 27 image that a Mac renders the same as.
      - name: Every mark is what the Blob source makes
        if: env.MARKS != 'skip'
        run: scripts/design.sh marks --check
      # A build graph is only good for the toolchain that wrote it. SwiftPM bakes absolute SDK
      # and framework paths into the objects it produces, and the runner's Xcode moves under
      # it: an image update left every restored cache pointing at an SDK that was no longer
      # there, and the link failed with every AgentsKitCore symbol undefined. This is part of
      # every cache key below, so a new image is a miss (a cold build that works) rather than a
      # restore nobody can use.
      - name: Toolchain fingerprint
        if: env.APPS != 'skip'
        id: toolchain
        run: |
          version="$(xcodebuild -version | tr -dc '0-9A-Za-z.')"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          echo "fingerprint=${version}-sdk${sdk}" >> "$GITHUB_OUTPUT"
      # The DerivedData key ends in a hash of the sources its builds read (#269), so new sources
      # miss their exact key, start warm from the nearest restore-key, and save a key of their
      # own. `git ls-tree` names each folder by its tree hash.
      - name: Cache keys
        if: env.APPS != 'skip'
        id: keys
        env:
          MANIFESTS: ${{ hashFiles('project.yml', 'Packages/AgentsKit/Package.swift', 'Packages/AgentsKit/Package.resolved', 'Packages/CodeText/Package.swift', 'Packages/CodeText/Package.resolved') }}
        run: |
          xcode="$(git ls-tree HEAD -- project.yml App Host Packages Remote RemoteNotify RemoteShare RemoteWidget Shared Web | git hash-object --stdin)"
          echo "base=${{ steps.toolchain.outputs.fingerprint }}-${MANIFESTS}" >> "$GITHUB_OUTPUT"
          echo "xcode=${xcode}" >> "$GITHUB_OUTPUT"
          agentskit="$(git ls-tree HEAD -- Packages/AgentsKit/Package.swift Packages/AgentsKit/Sources | git hash-object --stdin)"
          echo "agentskit=${agentskit}" >> "$GITHUB_OUTPUT"
      # DerivedData (build-cache.sh's build/DerivedData) and the packages it fetches. Each falls
      # back to a part of the same sources (#5794), then to the newest built from the same
      # manifests, then to the newest for this toolchain; there is deliberately no key that
      # ignores the fingerprint.
      - name: Restore Xcode build cache
        if: env.APPS != 'skip'
        id: xcode-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/DerivedData
            ~/Library/Caches/Agents-build/packages
            ~/Library/Caches/Agents-build/checkouts
          key: macos-xcode-27-dd-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}-full-graph
          restore-keys: |
            macos-xcode-27-dd-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}-
            macos-xcode-27-dd-${{ steps.keys.outputs.base }}-
            macos-xcode-27-dd-${{ steps.toolchain.outputs.fingerprint }}-
      # A mark of when the restore ended: a file in DerivedData newer than it was built in this
      # run (the cache's tar keeps the restored files' times). "Did a scheme build here" reads it.
      - name: Mark the restored Xcode build cache
        if: env.APPS != 'skip'
        run: touch "$RUNNER_TEMP/xcode-restored"
      # A graph restored from another tree can hold an AgentsKit that Xcode will not rebuild
      # (#679, #681, #683): when the recorded AgentsKit sources differ, only AgentsKit's own
      # objects go, and the rest stays warm.
      - name: Drop a stale AgentsKit from the Xcode build cache
        if: ${{ env.APPS != 'skip' && (steps.xcode-cache.outputs.cache-matched-key != '' && steps.xcode-cache.outputs.cache-hit != 'true') }}
        env:
          AGENTSKIT: ${{ steps.keys.outputs.agentskit }}
        run: |
          built="$(cat build/DerivedData/agentskit-sources 2>/dev/null || true)"
          if [[ "$built" != "$AGENTSKIT" ]]; then
            echo "AgentsKit sources differ from the restored graph's (${built:-unrecorded}); dropping its objects."
            rm -rf build/DerivedData/Build/Intermediates.noindex/AgentsKit.build
            find build/DerivedData/Build/Products -maxdepth 2 -name 'AgentsKit*' -exec rm -rf {} +
          fi
      - name: Tools
        if: env.APPS != 'skip'
        run: |
          xcodebuild -version
          brew install xcodegen &
          xcodegen_pid=$!
          # The runner's Xcode comes without it, and the app's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"
      # Agents Host's build makes Web/dist (#473) and carries agentsd, agents-control and the MCP
      # servers, all Go (#1314).
      - uses: actions/setup-node@v5
        if: env.APPS != 'skip'
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      # Not setup-go's cache (#2512): keyed on go.mod alone, it held none of this job's
      # darwin/arm64 and darwin/amd64 `-trimpath` builds.
      - uses: actions/setup-go@v6
        if: env.APPS != 'skip'
        with:
          go-version-file: Go/go.mod
          cache: false
      # Its key ends in full (the Go tasks passed) or part (they failed or ran out of time), then
      # the run (#5704): a part restores by prefix, so a rerun and the next run start warm, and
      # it never hits the exact key that would stop a full one from being saved.
      - name: Go build cache key
        id: go-key
        if: env.APPS != 'skip'
        run: echo "prefix=go-apps-$RUNNER_OS-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        if: env.APPS != 'skip'
        id: go-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-key.outputs.prefix }}-full
          restore-keys: |
            ${{ steps.go-key.outputs.prefix }}-full-
            ${{ steps.go-key.outputs.prefix }}-
            go-apps-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-apps-${{ runner.os }}-
      - name: Go build cache size
        if: env.APPS != 'skip' && env.MAIN_CACHE == 'true'
        run: bash scripts/ci-cache-grew.sh mark go ~/Library/Caches/go-build ~/go/pkg/mod
      - name: Restore the Nx cache
        if: env.APPS != 'skip'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-apps-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          restore-keys: nx-apps-
      # Nx names its cache database for the machine's UUID: when it differs from the runner that
      # saved the cache, give the restored database this runner's name, or Nx uses none of the
      # cache (#5762). A pull request's head from before the script landed does not have it.
      - name: Name the Nx database for this runner
        if: env.APPS != 'skip'
        run: if [[ -f scripts/ci-nx-db.sh ]]; then bash scripts/ci-nx-db.sh "$NX_WORKSPACE_DATA_DIRECTORY"; fi
      - name: Install from the lockfile
        if: env.APPS != 'skip'
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      - name: Time left for Nx
        if: env.APPS != 'skip'
        id: budget
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      # mac:build and remote:build, one at a time (they share build/DerivedData), and the tasks
      # they depend on (wire:gen, design:gen, web:build). A build that fails on a restored
      # DerivedData gets one more go from clean (scripts/ci-clean-retry.sh says why); a task that
      # passed is in the Nx cache, so the retry runs only what failed.
      - name: Nx affected
        if: env.APPS != 'skip'
        id: nx
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RESTORED: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          nx_apps() {
            if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              scripts/nx.sh affected -t build --exclude='*,!mac,!remote' --base="$BASE" --head=HEAD --parallel=1 --output-style=stream
            else
              scripts/nx.sh run-many -t build --projects=mac,remote --parallel=1 --output-style=stream
            fi
          }
          clean_retry "$RESTORED" build/DerivedData -- nx_apps
      - name: Save the Nx cache
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled())) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-apps-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled())) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-apps-" "nx-apps-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      # The Go helpers are built in Agents Host's build, so its outcome alone says whether the Go
      # cache is full or part. A run that ran out of time saves a part (#5704). Only main saves,
      # and only a cache that grew (#5740); it keeps its newest, and a part keeps the full one.
      - name: Did the Go build cache grow
        id: go-grew
        if: ${{ env.APPS != 'skip' && always() && !cancelled() && env.MAIN_CACHE == 'true' && !startsWith(steps.go-cache.outputs.cache-matched-key, format('{0}-full-', steps.go-key.outputs.prefix)) }}
        run: bash scripts/ci-cache-grew.sh check go ~/Library/Caches/go-build ~/go/pkg/mod
      # Only what a run used in the last 6 hours, under a cap, and no module zips (#5837): the
      # cache grew by every run's dead entries, and the Go caches then pushed the Xcode
      # DerivedData cache out of the repo's 10 GB. After the grow check, which reads the size
      # before the trim.
      - name: Trim the Go caches
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled() && steps.go-grew.outputs.save == 'true')) && !inputs.sha }}
        env:
          GO_CACHE_MAX_MB: 6144
        run: bash scripts/ci-go-cache-trim.sh ~/Library/Caches/go-build ~/go/pkg/mod
      - name: Save Go build cache
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled() && steps.go-grew.outputs.save == 'true')) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-key.outputs.prefix }}-${{ steps.nx.outcome == 'success' && 'full' || 'part' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prune old Go build caches for this ref
        if: ${{ (env.APPS != 'skip' && (always() && !cancelled() && steps.go-grew.outputs.save == 'true')) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-apps-${{ runner.os }}-" "${{ steps.go-key.outputs.prefix }}-${{ steps.nx.outcome == 'success' && 'full' || 'part' }}-${{ github.run_id }}-${{ github.run_attempt }}" "$GITHUB_REF"
      # Only on a push to main, as the golangci-lint cache (2026-11-13): this graph is about 2 GB,
      # and a pull request's own, under its merge ref, no other pull request can read. A pull
      # request restores main's newest through the restore-keys above. Only when a scheme built
      # in this run: an Nx cache hit builds nothing, and leaves DerivedData as it was. One scheme
      # is enough (2026-11-16): a push to main usually changes only the Mac app, so Nx builds
      # mac:build alone, and when both had to build here no cache was saved at all; every apps
      # job built the Mac app cold, 10 to 15 minutes of a PR's 20. A graph with one scheme
      # restores warm for that scheme, and the next push that builds the other saves both.
      # Also when Nx affected failed or ran out of time (#5794), as the Go cache's part (#5704):
      # a cold build of both schemes does not fit in the step's budget, so main failed, saved
      # nothing, and the next run was cold again, a loop that left every apps job cold. A part
      # keeps what built (one scheme, or some of its targets), so the next run starts warm and
      # can finish and save a full graph. It never takes the full key, and the prune never
      # deletes a full one for it. A part that does not build is rebuilt from clean
      # (ci-clean-retry.sh).
      - name: Did a scheme build here
        id: built
        if: ${{ env.APPS != 'skip' && (always() && !cancelled() && env.MAIN_CACHE == 'true' && steps.xcode-cache.outputs.cache-hit != 'true' && (steps.nx.outcome == 'success' || steps.nx.outcome == 'failure')) }}
        env:
          OUTCOME: ${{ steps.nx.outcome }}
        run: |
          products=build/DerivedData/Build/Products
          intermediates=build/DerivedData/Build/Intermediates.noindex
          built="$(find "$products/Debug" "$products/Debug-iphonesimulator" "$intermediates" -newer "$RUNNER_TEMP/xcode-restored" -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$built" ]]; then
            echo "${{ steps.keys.outputs.agentskit }}" > build/DerivedData/agentskit-sources
            echo "save=true" >> "$GITHUB_OUTPUT"
            if [[ $OUTCOME == success ]]; then
              echo "key=full-graph" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Nx affected did not finish; saving what built as a part (#5794)."
              echo "key=part-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Save Xcode build cache
        if: ${{ (env.APPS != 'skip' && (always() && steps.built.outputs.save == 'true')) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/DerivedData
            ~/Library/Caches/Agents-build/packages
            ~/Library/Caches/Agents-build/checkouts
          key: macos-xcode-27-dd-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}-${{ steps.built.outputs.key }}
      - name: Prune old Xcode caches for this ref
        if: ${{ (env.APPS != 'skip' && (always() && steps.built.outputs.save == 'true')) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-dd- 'macos-xcode-27-dd-${{ steps.keys.outputs.base }}-${{ steps.keys.outputs.xcode }}-${{ steps.built.outputs.key }}' "$GITHUB_REF"
      # Where this job's minutes went, in its summary; on a failure near the limit, an error that
      # names the slowest step (#5673).
      - name: Step times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 30
          STATUS: ${{ job.status }}
        run: bash scripts/ci-step-times.sh

  # Two macOS jobs side by side, and `test`, the check main requires (#5645), which passes only
  # when both did (#5755): one 20-minute job did not hold the Swift tests (7 to 8 minutes on a
  # change to Go, which agentskit-repo reads) and then the Go tests on a Mac (6 to 7), so both
  # ran out of time on main and on pull requests.
  #
  # test-swift, beside `apps`:
  #  - AgentsKit and CodeText, as Nx's tasks (#5631): agentskit:test-unit, test-control and
  #    test-integration, agentskit-repo:test (the suites that read files outside the package,
  #    so their inputs are the repo's), and codetext:test, each a `swift test` through
  #    scripts/build-cache.sh. A target whose inputs did not change is a cache hit;
  #  - SwiftLint against .swiftlint-baseline.json (#5645), as Nx's swift-lint:lint (#5672): a
  #    finding not in it fails.
  # Each step's `if:` reads `changes`'s outputs (SWIFT, SWIFTLINT).
  test-swift:
    needs: changes
    # `always()` so a failed `changes` still runs this job rather than skipping it, which would
    # read as a pass: an output that `changes` did not reach is empty, not 'skip', so its steps run.
    if: ${{ always() && !cancelled() && (!inputs.jobs || contains(format(' {0} ', inputs.jobs), ' test ')) && needs.changes.outputs.swift != 'skip' }}
    runs-on: xcode-27
    # The limit of every job, as in `go` (#5673): warm, the Swift targets take about 5 to 8
    # minutes. Every AgentsKit target from cold does not fit in it: such a run fails, and its
    # Step times say so. The "Time left for" step below reads the same number as JOB_MINUTES;
    # change them together.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
      SWIFT: ${{ needs.changes.outputs.swift }}
      SWIFTLINT: ${{ needs.changes.outputs.swiftlint }}
    steps:
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - name: History
        run: bash scripts/ci-history.sh
      - name: Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      # As in `apps`: a new image is a miss, not a restore nobody can use.
      - name: Toolchain fingerprint
        id: toolchain
        run: |
          version="$(xcodebuild -version | tr -dc '0-9A-Za-z.')"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          echo "fingerprint=${version}-sdk${sdk}" >> "$GITHUB_OUTPUT"
      - name: Cache keys
        id: keys
        run: |
          codetext="$(git ls-tree HEAD -- Packages/CodeText | git hash-object --stdin)"
          agentskit="$(git ls-tree HEAD -- Packages/AgentsKit | git hash-object --stdin)"
          sources="$(git ls-tree HEAD -- Packages/AgentsKit/Package.swift Packages/AgentsKit/Sources | git hash-object --stdin)"
          {
            echo "codetext=${codetext}"
            echo "agentskit=${agentskit}"
            echo "agentskit-sources=${sources}"
          } >> "$GITHUB_OUTPUT"
      - name: Restore CodeText build cache
        if: env.SWIFT != 'skip'
        id: codetext-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/CodeText/.build
          key: macos-xcode-27-codetext-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.codetext }}
          restore-keys: macos-xcode-27-codetext-${{ steps.toolchain.outputs.fingerprint }}-
      - name: Restore AgentsKit build cache
        if: env.SWIFT != 'skip'
        id: agentskit-cache
        uses: actions/cache/restore@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.agentskit }}
          restore-keys: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-
      # The stale graph of #684 in SwiftPM's build: when the recorded AgentsKit sources differ,
      # only the package's own targets go, and swift-nio, swift-nio-ssl and SwiftTerm stay warm.
      - name: Drop a stale AgentsKit from the AgentsKit build cache
        if: ${{ env.SWIFT != 'skip' && (steps.agentskit-cache.outputs.cache-matched-key != '' && steps.agentskit-cache.outputs.cache-hit != 'true') }}
        run: bash scripts/drop-stale-agentskit.sh Packages/AgentsKit/.build "${{ steps.keys.outputs.agentskit-sources }}"
      - name: Tools
        if: env.SWIFT != 'skip'
        run: |
          xcodebuild -version
          # The runner's Xcode comes without it, and AgentsKit's build compiles Metal.
          xcodebuild -downloadComponent MetalToolchain
      # SwiftPM's build graph records the random cryptex mount name for MetalToolchain, and
      # every absolute path of the Xcode and SDK that made it: rewrite the mount, or drop the
      # graph when it names an Xcode or SDK this runner does not have.
      - name: Normalize AgentsKit build cache
        if: env.SWIFT != 'skip'
        run: python3 scripts/normalize-metaltoolchain-cache.py Packages/AgentsKit/.build
      # How long the runner's login shell takes to say its PATH. The app reads it once per
      # process, synchronously, the first time anything looks a runtime up.
      - name: Time the login shell
        if: env.SWIFT != 'skip'
        run: time zsh -lc 'printf %s "$PATH"' > /dev/null
      # agentskit-repo:test depends on web:build, as WebDistManifestTests reads Web/dist, which
      # needs Node and the packages; Go as before the Go tests moved to test-go (#5755);
      # SwiftLint, a task of Nx, Node and the packages.
      - uses: actions/setup-node@v5
        if: env.SWIFT != 'skip' || env.SWIFTLINT != 'skip'
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      - uses: actions/setup-go@v6
        if: env.SWIFT != 'skip'
        with:
          go-version-file: Go/go.mod
          cache: false
      - name: Restore the Nx cache
        if: env.SWIFT != 'skip' || env.SWIFTLINT != 'skip'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-macos-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          restore-keys: nx-macos-
      # Nx names its cache database for the machine's UUID: when it differs from the runner that
      # saved the cache, give the restored database this runner's name, or Nx uses none of the
      # cache (#5762). A pull request's head from before the script landed does not have it.
      - name: Name the Nx database for this runner
        if: env.SWIFT != 'skip' || env.GO != 'skip' || env.SWIFTLINT != 'skip'
        run: if [[ -f scripts/ci-nx-db.sh ]]; then bash scripts/ci-nx-db.sh "$NX_WORKSPACE_DATA_DIRECTORY"; fi
      - name: Install from the lockfile
        if: env.SWIFT != 'skip' || env.SWIFTLINT != 'skip'
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      # A job that reaches its timeout-minutes ends Cancelled, not Failed, and a pull request
      # with auto-merge on waits for a check that never comes; a step's own timeout fails the
      # step (scripts/ci-time-left.sh, #5609).
      # The reserve is the steps after it: SwiftLint and the cache saves. The Go tests on a Mac
      # are `test-go`'s, beside this job (#5755), so they take none of its minutes.
      - name: Time left for Nx
        if: env.SWIFT != 'skip'
        id: budget
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      # One target at a time: they share each package's .build, and at most three tests at a
      # time, one per core (#1320; each target's command). Nx's log says which target failed and
      # how long each took, and a failing one does not stop the rest (--nx-bail is off). A run
      # that fails on a restored .build gets one more go from clean; the targets that passed are
      # in the Nx cache, so only the failed ones run again.
      - name: Nx affected, Swift
        if: env.SWIFT != 'skip'
        id: nx
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RESTORED: ${{ steps.agentskit-cache.outputs.cache-matched-key }}${{ steps.codetext-cache.outputs.cache-matched-key }}
        run: |
          source scripts/ci-clean-retry.sh
          nx_swift() {
            if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              scripts/nx.sh affected -t test --exclude='*,!agentskit,!agentskit-repo,!codetext' --base="$BASE" --head=HEAD --parallel=1 --output-style=stream
            else
              scripts/nx.sh run-many -t test --projects=agentskit,agentskit-repo,codetext --parallel=1 --output-style=stream
            fi
          }
          clean_retry "$RESTORED" Packages/AgentsKit/.build Packages/CodeText/.build -- nx_swift
      - name: Save the Nx cache
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-macos-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-macos-" "nx-macos-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      # Only a .build that this run built. Never on a failure: a cancelled or failed run must not
      # persist a partial cache that poisons a later restore.
      - name: Did AgentsKit build here
        id: agentskit-built
        if: ${{ always() && !cancelled() && env.MAIN_CACHE == 'true' && steps.nx.outcome == 'success' && steps.agentskit-cache.outputs.cache-hit != 'true' }}
        run: |
          if [[ -d Packages/AgentsKit/.build ]]; then
            echo "${{ steps.keys.outputs.agentskit-sources }}" > Packages/AgentsKit/.build/agentskit-sources
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save AgentsKit build cache
        if: ${{ (always() && steps.agentskit-built.outputs.save == 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: Packages/AgentsKit/.build
          key: macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.agentskit }}
      - name: Prune old AgentsKit caches for this ref
        if: ${{ (always() && steps.agentskit-built.outputs.save == 'true') && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-agentskit- 'macos-xcode-27-agentskit-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.agentskit }}' "$GITHUB_REF"
      - name: Did CodeText build here
        id: codetext-built
        if: ${{ always() && !cancelled() && env.MAIN_CACHE == 'true' && steps.nx.outcome == 'success' && steps.codetext-cache.outputs.cache-hit != 'true' }}
        run: |
          if [[ -d Packages/CodeText/.build ]]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save CodeText build cache
        if: ${{ (always() && steps.codetext-built.outputs.save == 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: Packages/CodeText/.build
          key: macos-xcode-27-codetext-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.codetext }}
      - name: Prune old CodeText caches for this ref
        if: ${{ (always() && steps.codetext-built.outputs.save == 'true') && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh macos-xcode-27-codetext- 'macos-xcode-27-codetext-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.keys.outputs.codetext }}' "$GITHUB_REF"
      # Where this job's minutes went, in its summary; on a failure near the limit, an error that
      # names the slowest step (#5673).
      - name: Step times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          STATUS: ${{ job.status }}
        run: bash scripts/ci-step-times.sh

  # swift-lint:lint: SwiftLint over every Swift file (#6336; Periphery removed, #6526).
  swift-lint:
    needs: changes
    if: ${{ always() && !cancelled() && (!inputs.jobs || contains(format(' {0} ', inputs.jobs), ' test ')) && needs.changes.outputs.swiftlint != 'skip' }}
    runs-on: xcode-27
    # The limit of every job, as in `go` (#5673).
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
    steps:
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - name: History
        run: bash scripts/ci-history.sh
      # SwiftLint reads Swift with this Xcode's SourceKit.
      - name: Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      # Nx itself runs on Node, from the lockfile.
      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      - name: Install from the lockfile
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      - name: SwiftLint
        timeout-minutes: 10
        run: scripts/nx.sh run swift-lint:lint --output-style=stream

  # test-go, beside test-swift and `apps`: the Go module on a Mac (#1138), so a Mac-only path
  # (its root, its folders, a *_darwin.go file) is held as Linux's is. TMPDIR is resolved,
  # because a Mac's temporary folder is reached through the /var link and the daemon keeps
  # folders with their links resolved. Each step's `if:` reads GO: `changes`'s gomac, which is
  # its go.
  test-go:
    needs: changes
    # `always()`, as in test-swift: a failed `changes` runs this job rather than skip it.
    if: ${{ always() && !cancelled() && (!inputs.jobs || contains(format(' {0} ', inputs.jobs), ' test ')) && needs.changes.outputs.gomac != 'skip' }}
    runs-on: xcode-27
    # The limit of every job, as in `go` (#5673): the Go tests on a Mac take about 6 to 7
    # minutes, and their restore about 1 to 2. The "Time left for" step below reads the same
    # number as JOB_MINUTES; change them together.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_LOAD_DOT_ENV_FILES: "false"
      NX_TUI: "false"
      GO: ${{ needs.changes.outputs.gomac }}
    steps:
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Nx's folders
        run: |
          echo "NX_CACHE_DIRECTORY=$RUNNER_TEMP/nx/cache" >> "$GITHUB_ENV"
          echo "NX_WORKSPACE_DATA_DIRECTORY=$RUNNER_TEMP/nx/data" >> "$GITHUB_ENV"
          # go:test keeps each shard's log and its summary here (#6008).
          echo "GO_TEST_LOG_DIR=$RUNNER_TEMP/go-test-logs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
      - name: History
        run: bash scripts/ci-history.sh
      - name: Xcode
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        if: env.GO != 'skip'
        with:
          node-version-file: Web/.node-version
          package-manager-cache: false
      - uses: actions/setup-go@v6
        if: env.GO != 'skip'
        with:
          go-version-file: Go/go.mod
          cache: false
      # A key of its own, so this job and test-swift never save the same key, and test-swift's
      # restore by prefix never takes this one. nx-macos- is test-swift's, which held the Go tasks
      # too before #5755: the first runs start warm from it.
      - name: Restore the Nx cache
        if: env.GO != 'skip'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-gomac-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            nx-gomac-
            nx-macos-
      - name: Install from the lockfile
        if: env.GO != 'skip'
        timeout-minutes: 5
        run: |
          scripts/pnpm.sh install --frozen-lockfile
          scripts/pnpm.sh audit signatures
      # Go's own caches, under Nx's, as in `go`.
      # Its key ends in full (the Go tasks passed) or part (they failed or ran out of time), then
      # the run (#5704): a part restores by prefix, so a rerun and the next run start warm, and
      # it never hits the exact key that would stop a full one from being saved.
      - name: Go build cache key
        id: go-key
        if: env.GO != 'skip'
        run: echo "prefix=go-race-$RUNNER_OS-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Go build cache
        id: go-cache
        if: env.GO != 'skip'
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-key.outputs.prefix }}-full
          restore-keys: |
            ${{ steps.go-key.outputs.prefix }}-full-
            ${{ steps.go-key.outputs.prefix }}-
            go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-
            go-race-${{ runner.os }}-
      - name: Go build cache size
        if: env.GO != 'skip' && env.MAIN_CACHE == 'true'
        run: bash scripts/ci-cache-grew.sh mark go ~/Library/Caches/go-build ~/go/pkg/mod
      - name: Time left for Go
        id: go-budget
        if: env.GO != 'skip'
        env:
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          RESERVE: 3
        run: bash scripts/ci-time-left.sh
      # Each tracked file's time from its content, as in `go` (#5677): Go's test cache then runs
      # only the packages whose inputs changed, where a checkout's own times made 20 of the 70
      # tested packages, internal/agentsd and internal/controlplane with them, run every time.
      - name: Content times
        if: env.GO != 'skip'
        run: python3 scripts/ci-mtimes.py
      # The Go tasks on a Mac, one task at a time (#5632).
      - name: Nx affected, Go on a Mac
        id: go-nx
        if: env.GO != 'skip'
        timeout-minutes: ${{ fromJSON(steps.go-budget.outputs.minutes) }}
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          export TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)
          # No lint: go:lint and repo-lint:lint are the Linux job's, which reads Go as Linux.
          targets=gen,build,vet,test
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/nx.sh affected -t "$targets" --exclude='web,tag:xcode' --base="$BASE" --head=HEAD --parallel=1 --output-style=stream
          else
            scripts/nx.sh run-many -t "$targets" --exclude='web,tag:xcode' --parallel=1 --output-style=stream
          fi
      # Nx can cut a task's output before its end (#6008): how each go:test shard ended, from
      # outside Nx, and the shard logs as an artifact.
      - name: Go test summary
        if: ${{ failure() && steps.go-nx.outcome == 'failure' }}
        run: bash scripts/ci-go-test-summary.sh
      # On every run, not only a failed one: load.log shows how near a green run came to its
      # limit, and what it waited on (#7480).
      - name: Upload the Go test logs
        if: ${{ always() && steps.go-nx.outcome != 'skipped' }}
        uses: actions/upload-artifact@v5
        with:
          name: go-test-logs-mac-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-test-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the Nx cache
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-gomac-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ (always() && !cancelled()) && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-gomac-" "nx-gomac-${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      - name: Did the Go build cache grow
        id: go-grew
        if: ${{ always() && !cancelled() && env.GO != 'skip' && env.MAIN_CACHE == 'true' && !startsWith(steps.go-cache.outputs.cache-matched-key, format('{0}-full-', steps.go-key.outputs.prefix)) }}
        run: bash scripts/ci-cache-grew.sh check go ~/Library/Caches/go-build ~/go/pkg/mod
      # Only what a run used in the last 6 hours, under a cap, and no module zips (#5837): the
      # cache grew by every run's dead entries, and the Go caches then pushed the Xcode
      # DerivedData cache out of the repo's 10 GB. After the grow check, which reads the size
      # before the trim.
      - name: Trim the Go caches
        if: ${{ (always() && !cancelled() && env.GO != 'skip' && steps.go-grew.outputs.save == 'true') && !inputs.sha }}
        env:
          GO_CACHE_MAX_MB: 6144
        run: bash scripts/ci-go-cache-trim.sh ~/Library/Caches/go-build ~/go/pkg/mod
      - name: Save Go build cache
        if: ${{ (always() && !cancelled() && env.GO != 'skip' && steps.go-grew.outputs.save == 'true') && !inputs.sha }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-key.outputs.prefix }}-${{ steps.go-nx.outcome == 'success' && 'full' || 'part' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prune old Go build caches for this ref
        if: ${{ (always() && !cancelled() && env.GO != 'skip' && steps.go-grew.outputs.save == 'true') && !inputs.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-race-${{ runner.os }}-" "${{ steps.go-key.outputs.prefix }}-${{ steps.go-nx.outcome == 'success' && 'full' || 'part' }}-${{ github.run_id }}-${{ github.run_attempt }}" "$GITHUB_REF"
      # Where this job's minutes went, in its summary; on a failure near the limit, an error that
      # names the slowest step (#5673).
      - name: Step times
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ steps.clock.outputs.start }}
          JOB_MINUTES: 20
          STATUS: ${{ job.status }}
        run: bash scripts/ci-step-times.sh

  # The check main requires (#5645): it passes when test-swift and test-go each passed or were
  # skipped, and fails when either failed or was cancelled (a job that reaches its limit ends
  # Cancelled, #5609). A skipped job satisfies a required check, so with both skipped this passes
  # too. The failing job's own log says what failed.
  test:
    needs: [changes, test-swift, test-go, swift-lint]
    if: ${{ always() && !cancelled() && (!inputs.jobs || contains(format(' {0} ', inputs.jobs), ' test ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: test-swift, test-go and swift-lint
        env:
          SWIFT: ${{ needs.test-swift.result }}
          GO: ${{ needs.test-go.result }}
          LINT: ${{ needs.swift-lint.result }}
        run: |
          echo "test-swift: $SWIFT, test-go: $GO, swift-lint: $LINT"
          failed=0
          for job in "test-swift:$SWIFT" "test-go:$GO" "swift-lint:$LINT"; do
            case ${job#*:} in
              success | skipped) ;;
              *) echo "::error::${job%%:*} ended ${job#*:}: its own log says why."; failed=1 ;;
            esac
          done
          exit "$failed"
