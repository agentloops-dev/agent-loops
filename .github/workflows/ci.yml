      # not have finished writing. Each ref keeps only its newest.
      - name: Save the Nx cache
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/nx
          key: nx-macos-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
      - name: Prune old Nx caches for this ref
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "nx-macos-" "nx-macos-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}" "$GITHUB_REF"
      - name: Save Go build cache
        if: ${{ always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}
      - name: Prune old Go build caches for this ref
        if: ${{ always() && !cancelled() && steps.go-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-ci-caches.sh "go-race-${{ runner.os }}-" "go-race-${{ runner.os }}-${{ hashFiles('Go/go.mod', 'Go/go.sum') }}-${{ hashFiles('Go/**/*.go') }}" "$GITHUB_REF"

  # The Blob's marks (#4615): every icon, favicon and touch icon is what `scripts/design.sh
  # marks` makes from the one source in design/logo/blob/final/. It renders with AppKit, so it
  # runs on the macOS 27 image that a Mac renders the same as.
  marks:
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.marks != 'skip') }}
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Every mark is what the Blob source makes
        run: scripts/design.sh marks --check

  # The linters (#1224), through scripts/lint.sh, on every change: shellcheck, zsh -n, our
  # own text checks, and golangci-lint's unused and ineffassign (#2162) are required (a
  # finding fails the job). ruff, Biome, SwiftLint, jscpd, govulncheck and the other
  # golangci-lint rules report findings in the job's summary, and which are in this
  # change's files, without failing. Their old findings are listed in
  # .agents/reviews/lint-2026-10-17.md; jscpd's first report is in
  # .agents/reviews/lint-dupes-2026-10-23.md. The pinned binaries are cached, and golangci-lint's
  # analysis with them. It runs beside the macOS jobs, which take longer, so it does not make a
  # merge wait.
  #
  # The checks include check-test-indexing.py (#94): tests that index or force-unwrap after an
  # #expect, where a failed check carries on and the trap after it ends the whole `swift test`.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache-dependency-path: Go/go.mod
      - uses: actions/cache@v5
        with:
          path: ~/.cache/lint-tools
          key: lint-tools-${{ hashFiles('scripts/lint.sh') }}
      # golangci-lint's analysis, warm from main's newest; only a push to main that changed Go
      # saves one.
      - uses: actions/cache/restore@v5
        id: golangci-cache
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('Go/**/*.go', 'Go/go.sum', 'Go/.golangci.yml') }}
          restore-keys: golangci-lint-
      - name: Tools
        run: |
          scripts/lint.sh --tools ~/.cache/lint-tools shellcheck ruff biome swiftlint jscpd golangci-lint govulncheck
          echo ~/.cache/lint-tools >> "$GITHUB_PATH"
      - name: Lint
        env:
          # A pull request is checked out as its merge into the base: the first parent is the base.
          LINT_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: scripts/lint.sh
      # What a caller sends changed since the last release tag with the same capability
      # number (#4095): an older server refuses it, and the caller cannot know.
      - name: Wire compat
        run: |
          if git diff --quiet HEAD^1 HEAD -- Packages/Wire; then
            echo "Packages/Wire did not change."
          else
            scripts/wire.sh compat
          fi
      - if: ${{ github.event_name == 'push' && steps.golangci-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ hashFiles('Go/**/*.go', 'Go/go.sum', 'Go/.golangci.yml') }}
