# Publishes Agent Loops on GitHub when a version tag is pushed (#669, #4225): `git tag v0.2.0 &&
# git push origin v0.2.0` makes the release at releases/latest.
#
# The release carries:
#   Agent-Loops-<version>.dmg              signed with Developer ID, notarized, stapled
#   Agent-Loops-<version>.zip              the same app, stapled, for Macs that can't mount a .dmg
#   Agents-<version>.zip                   the same app as Agents.app, and
#   Agents-Host-<version>.zip              as Agents Host.app, for the self-update of an Agents
#                                          or an Agents Host, which renames it Agent Loops.app
#                                          (#5297, #4225)
#   agentsd-linux-<arch>-<version>.tar.gz  the Linux agentsd (Go, #1136), with the MCP
#                                          servers Agents ships (#700), agents-control (#6610)
#                                          and the web page it serves (#7288)
#   loops-<os>-<arch>-<version>.tar.gz    loops, the command-line client (#6448), for darwin and
#                                          linux, arm64 and amd64; the macOS ones signed and
#                                          notarized (scripts/build-loops.sh)
#   SHA256SUMS, and SHA256SUMS.sig, its signature (Go/internal/releasesig)
#
# and the control plane's image, ghcr.io/<owner>/agents-control:<version> (#2140, #4958), signed.
#
# Beside it, the testflight job (#914) uploads the Remote to TestFlight as an .ipa, version <tag>
# and build <run number>, and waits until App Store Connect has processed it. The Mac is not in
# the App Store (#4229). Nothing is submitted to App Review here: app-store.yml
# does that, when a person approves it (#3657).
#
# The release notes are the tag's message when it has one (the release skill writes them,
# .agents/skills/release); otherwise GitHub makes them from the merged pull requests.
#
# The signing material is in the secrets of two environments, release and release-sign. Their
# deployment rule lets a run of a v* tag reach them: it looks at the tag's name, not at what
# the tag is on. Each job checks that the tag is on main before it uses one. Who can make a
# v* tag, and who approves release-sign, are settings of the repository. How to make each is in docs/how-to/release-agents-host.md:
#   DEVELOPER_ID_P12, DEVELOPER_ID_P12_PASSWORD   the Developer ID Application identity
#   ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID         the App Store Connect key, for notarytool
#                                                 and altool
# in release-sign, for the sign job only (scripts/release-key.sh makes it,
# scripts/release-secrets.sh --signing-key sets it):
#   RELEASE_SIGNING_KEY                           the private key that signs SHA256SUMS
# and in release, for the testflight job (scripts/release-secrets.sh --store sets them):
#   APPLE_DISTRIBUTION_P12, APPLE_DISTRIBUTION_P12_PASSWORD   the Apple Distribution identity
#   PROFILE_REMOTE          "Agents Remote App Store"
#   PROFILE_REMOTE_NOTIFY   "Agents Remote Notify App Store"
#   PROFILE_REMOTE_WIDGET   "Agents Remote Widget App Store"
#   PROFILE_REMOTE_SHARE    "Agents Remote Share App Store"
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The v* tag to release again, which the run starts from (--ref) too
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Nothing is built, pushed or uploaded unless the run is the tag's own, the tag is on main,
  # and its public keys are the release's. It has no environment and no secret.
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: The run is the tag's own
        run: |
          [[ "$GITHUB_REF_TYPE" == tag && "$TAG" == "$GITHUB_REF_NAME" ]] || {
            echo "::error::Run it from the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG"; exit 1; }

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: The tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$TAG is not on main"; exit 1; }

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go/go.mod
          cache: false

      - name: The release's public keys are there
        run: Go/scripts/go.sh run ./cmd/release-sign check

  # The Linux agentsd (Go, #1136) and the MCP servers beside it, with Go/go.mod's Go. The
  # Swift one, and the Static Linux SDK it was built with, went in #1314.
  linux:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      servers: ${{ steps.servers.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh >/dev/null

      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache: false

      - name: Build agentsd for Linux
        env:
          AGENTS_BUILD: ${{ github.run_number }}
        run: |
          export AGENTS_MARKETING_VERSION="${TAG#v}"
          zsh scripts/build-linux-agentsd.sh
          for arch in x86_64 aarch64; do
            test -f App/Resources/servers/agentsd-linux-$arch || {
              echo "::error::agentsd was not built for $arch"; exit 1; }
          done

      - name: Digest of the files
        id: servers
        run: |
          cd App/Resources/servers
          digest=$(LC_ALL=C; sha256sum * | sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: servers
          path: App/Resources/servers
          retention-days: 3

  # The control plane's image (#2140): deploy/Containerfile for linux/amd64 and linux/arm64,
  # pushed to ghcr.io/<owner>/agents-control as <version>, and for a release X.Y.Z also as X.Y
  # and latest. It carries an SBOM and provenance (BuildKit's attestations), and a keyless
  # cosign signature made with this run's OIDC identity: docs/how-to/run-the-control-plane-in-the-cloud.md
  # says how to check it. GITHUB_TOKEN pushes it: no account or secret of our own.
  # <owner> is the repo's owner (#4958): a package belongs to its owner, and a release can
  # push only to its own owner's packages, so after a transfer the new owner gets the image.
  image:
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/agents-control
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: The tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$TAG is not on main"; exit 1; }

      # Go and the web page build on the runner's own platform (the Containerfile's
      # BUILDPLATFORM stages); only the Alpine stage's apk and adduser run as arm64, under QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        run: |
          version="${TAG#v}"
          tags=(--tag "$IMAGE:$version")
          if [[ $version =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags+=(--tag "$IMAGE:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" --tag "$IMAGE:latest")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file deploy/Containerfile --build-arg "VERSION=$version" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --sbom=true --provenance=mode=max \
            "${tags[@]}" --metadata-file "$RUNNER_TEMP/metadata.json" --push .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          [[ $digest == sha256:* ]] || { echo "::error::buildx gave no digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$digest: ${tags[*]}" >> "$GITHUB_STEP_SUMMARY"

      # The signature is on the digest, so every tag of it is signed.
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # The image job is required too: a release whose image did not push does not ship (#2140).
  mac:
    needs: [linux, image]
    runs-on: xcode-27
    timeout-minutes: 75
    environment: release
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.sums.outputs.digest }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: The tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$TAG is not on main"; exit 1; }

      - uses: actions/download-artifact@v6
        with:
          name: servers
          path: App/Resources/servers

      - name: They are the linux job's files
        env:
          DIGEST: ${{ needs.linux.outputs.servers }}
        run: |
          cd App/Resources/servers
          got=$(LC_ALL=C; shasum -a 256 * | shasum -a 256 | cut -d' ' -f1)
          [[ -n "$DIGEST" && "$got" == "$DIGEST" ]] || {
            echo "::error::the servers artifact is not what the linux job built"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version-file: Web/.node-version
          # Not its pnpm cache: scripts/pnpm.sh installs pnpm (#5628).
          package-manager-cache: false

      # Go for what Agents Host carries: agentsd, agents-control and the MCP servers (#1314).
      - uses: actions/setup-go@v6
        with:
          go-version-file: Go/go.mod
          cache-dependency-path: Go/go.mod

      - name: Tools
        run: |
          brew install xcodegen &
          xcodegen_pid=$!
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"

      # A keychain of the run's own, gone with the runner.
      - name: Signing
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/devid.p12"
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          security find-identity -v -p codesigning | grep "Developer ID Application"

      - name: Build, sign and notarize Agents
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          scripts/release-host.sh "${TAG#v}" "${{ github.run_number }}"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: release-logs
          path: build/release/*.log

      - name: Digest of SHA256SUMS
        id: sums
        run: echo "digest=$(shasum -a 256 build/release/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/*.tar.gz
            build/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # Signs SHA256SUMS, on a runner that built nothing. The environment release-sign has only
  # the signing key, and this is its only job: a reviewer it requires is asked here, once.
  # The signature goes to the publish job as an output, so the key is beside no write token.
  sign:
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-sign
    permissions:
      contents: read
    outputs:
      signature: ${{ steps.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: The tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$TAG is not on main"; exit 1; }

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go/go.mod
          cache: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-files
          path: build/release

      # SHA256SUMS is the one the mac job wrote (its output, which no other job can change),
      # and the files are those it lists and no other.
      - name: They are the mac job's files
        env:
          DIGEST: ${{ needs.mac.outputs.sums }}
        run: Go/scripts/go.sh run ./cmd/release-sign files "$DIGEST" "${TAG#v}" "$PWD/build/release/SHA256SUMS"

      - name: The release's public keys are there
        run: Go/scripts/go.sh run ./cmd/release-sign check

      # It fails when the private key is not that of one of the two public keys in the
      # tag's Go/internal/releasesig/keys.go.
      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: Go/scripts/go.sh run ./cmd/release-sign sign "${TAG#v}" "$PWD/build/release/SHA256SUMS"

      - name: Hand the signature on
        id: sign
        run: echo "signature=$(cat build/release/SHA256SUMS.sig)" >> "$GITHUB_OUTPUT"

  publish:
    needs: [mac, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}

      - name: The tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$TAG is not on main"; exit 1; }

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: Go/go.mod
          cache: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-files
          path: build/release

      # SHA256SUMS is the one the mac job wrote (its output, which no other job can change),
      # and the files are those it lists and no other.
      - name: They are the mac job's files
        env:
          DIGEST: ${{ needs.mac.outputs.sums }}
        run: Go/scripts/go.sh run ./cmd/release-sign files "$DIGEST" "${TAG#v}" "$PWD/build/release/SHA256SUMS"

      - name: The signature is good
        env:
          SIGNATURE: ${{ needs.sign.outputs.signature }}
        run: |
          echo "$SIGNATURE" > build/release/SHA256SUMS.sig
          Go/scripts/go.sh run ./cmd/release-sign verify "$PWD/build/release/SHA256SUMS"

      # The tag's message is the notes when it has one: checkout leaves the tag lightweight,
      # so it is fetched again as the annotated tag it is.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP/,$d' > "$RUNNER_TEMP/notes.md"
          notes=(--generate-notes)
          [[ "$(git cat-file -t "$TAG")" == tag && -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]] &&
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          cd build/release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *.dmg *.zip *.tar.gz SHA256SUMS SHA256SUMS.sig --clobber
          else
            gh release create "$TAG" *.dmg *.zip *.tar.gz SHA256SUMS SHA256SUMS.sig --title "Agent Loops ${TAG#v}" \
              "${notes[@]}" --verify-tag
          fi

      # The public download (#2145): the same files go to the releases-only repo, so the
      # download works when this repo is private. It needs RELEASES_TOKEN (a fine-grained
      # token with Contents: write on that repo) in the `release` environment; without it the
      # step says so and the release still stands.
      - name: Copy the release to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC_REPO: agentloops-dev/agents-releases
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::RELEASES_TOKEN is not set: $TAG is not copied to $PUBLIC_REPO (#2145)"
            exit 0
          fi
          cd build/release
          if gh release view "$TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" *.dmg *.zip *.tar.gz SHA256SUMS SHA256SUMS.sig --clobber --repo "$PUBLIC_REPO"
          else
            gh release create "$TAG" *.dmg *.zip *.tar.gz SHA256SUMS SHA256SUMS.sig --repo "$PUBLIC_REPO" \
              --title "Agent Loops ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # The Remote on TestFlight (#914). It needs nothing from the other jobs, and a
  # failure here leaves the GitHub release as it is.
  testflight:
    needs: keys
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      # First, so a missing secret is one clear line rather than a signing error later.
      - name: The App Store secrets are there
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_REMOTE: ${{ secrets.PROFILE_REMOTE }}
          PROFILE_REMOTE_NOTIFY: ${{ secrets.PROFILE_REMOTE_NOTIFY }}
          PROFILE_REMOTE_WIDGET: ${{ secrets.PROFILE_REMOTE_WIDGET }}
          PROFILE_REMOTE_SHARE: ${{ secrets.PROFILE_REMOTE_SHARE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          missing=()
          for name in APPLE_DISTRIBUTION_P12 APPLE_DISTRIBUTION_P12_PASSWORD PROFILE_REMOTE \
            PROFILE_REMOTE_NOTIFY PROFILE_REMOTE_WIDGET PROFILE_REMOTE_SHARE ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::The release environment has no ${missing[*]}. Set them with scripts/release-secrets.sh --store (docs/how-to/release-agents-host.md). Nothing was uploaded to TestFlight."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: The tag is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$TAG is not on main"; exit 1; }

      - name: Tools
        run: |
          brew install xcodegen &
          xcodegen_pid=$!
          xcodebuild -downloadComponent MetalToolchain
          wait "$xcodegen_pid"

      - name: Signing
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_REMOTE: ${{ secrets.PROFILE_REMOTE }}
          PROFILE_REMOTE_NOTIFY: ${{ secrets.PROFILE_REMOTE_NOTIFY }}
          PROFILE_REMOTE_WIDGET: ${{ secrets.PROFILE_REMOTE_WIDGET }}
          PROFILE_REMOTE_SHARE: ${{ secrets.PROFILE_REMOTE_SHARE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/store.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          rm "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "$PROFILE_REMOTE" | base64 --decode > "$profiles/agents-remote.mobileprovision"
          echo "$PROFILE_REMOTE_NOTIFY" | base64 --decode > "$profiles/agents-remote-notify.mobileprovision"
          echo "$PROFILE_REMOTE_WIDGET" | base64 --decode > "$profiles/agents-remote-widget.mobileprovision"
          echo "$PROFILE_REMOTE_SHARE" | base64 --decode > "$profiles/agents-remote-share.mobileprovision"
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          security find-identity -v "$keychain" | grep -q "Apple Distribution" || {
            echo "::error::APPLE_DISTRIBUTION_P12 holds no Apple Distribution identity, or its password is wrong"; exit 1; }

      # Before the archive, so a profile made before an entitlement was added (v0.12.1, #2781)
      # names the entitlement and the secret rather than failing the archive.
      - name: The App Store profiles allow every entitlement
        run: |
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          python3 scripts/check-store-profiles.py \
            "PROFILE_REMOTE=$profiles/agents-remote.mobileprovision" \
            "PROFILE_REMOTE_NOTIFY=$profiles/agents-remote-notify.mobileprovision" \
            "PROFILE_REMOTE_WIDGET=$profiles/agents-remote-widget.mobileprovision" \
            "PROFILE_REMOTE_SHARE=$profiles/agents-remote-share.mobileprovision"

      - name: Archive, check, export and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          scripts/release-store.sh "${TAG#v}" "${{ github.run_number }}"

      - name: Processed by App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          swift scripts/asc-builds.swift "${TAG#v}" "${{ github.run_number }}" --wait 45

      # What this run deployed, for Lineage (#3584): Agents reads the notice from the run, so App
      # Store Connect's key stays here. It names its environment, testflight= (#5242): this job's
      # forge environment is `release`, which holds secrets and is not a place.
      - name: Say the deploy
        run: echo "::notice title=deploy::testflight=testflight:com.alexecollins.agents.remote/${{ github.run_number }}"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: testflight-logs
          path: build/store/*.log
