# One pnpm workspace (#5628): Nx at the root, the web app in Web/. scripts/pnpm.sh runs the
# pinned pnpm; install only with --frozen-lockfile.
packages:
  - Web
# A release must be on npm for 7 days before pnpm takes it (rule 1 of #5627: malicious Nx
# versions were published in August 2025). Dependabot waits as long (.github/dependabot.yml).
minimumReleaseAge: 10080
# Pinned before this rule, 3 days after its release (design/icons.json pins its integrity too).
# Remove it from 2026-11-18, when it is 7 days old.
minimumReleaseAgeExclude:
  - lucide-static@1.72.0
# No package's install script runs (as `npm ci --ignore-scripts` did before): esbuild and Nx
# work without theirs.
allowBuilds:
  esbuild: false
  nx: false
